    .code-label{display:inline-flex;margin-bottom:.45rem;padding:.1rem .45rem;border-radius:.4rem;border:1px solid rgba(148,163,184,.22);color:#94a3b8;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .flowchart-wrap{margin:1.2rem 0;padding:1rem;border-radius:1rem;border:1px solid rgba(56,189,248,.30);background:rgba(2,6,23,.62);overflow-x:auto}
    .flowchart-title{font-weight:900;color:#7dd3fc;margin-bottom:.65rem}
    .decision-tree-svg{display:block;min-width:920px;width:100%;height:auto}
    .tree-edge{fill:none;stroke:rgba(148,163,184,.82);stroke-width:1.6}
    .tree-edge-marker{fill:rgba(148,163,184,.92)}
    .tree-node-rect{fill:rgba(15,23,42,.96);stroke:rgba(56,189,248,.45);stroke-width:1.6;rx:8;ry:8}
    .tree-node-decision{fill:rgba(15,23,42,.98);stroke:rgba(251,191,36,.78)}
    .tree-node-result{fill:rgba(24,24,27,.95);stroke:rgba(251,191,36,.72)}
    .tree-node-final{fill:rgba(2,6,23,.92);stroke:rgba(148,163,184,.80);stroke-dasharray:6 4}
    .tree-node-event{fill:rgba(30,41,59,.98);stroke:rgba(129,140,248,.78)}
    .tree-node-text{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;color:#e2e8f0;font-weight:900;font-size:12px;line-height:1.35;word-break:break-word}
    .tree-node-decision-text{color:#fde68a}
    .tree-node-result-text{color:#fed7aa}
    .tree-node-final-text{color:#cbd5e1}
    .tree-label-bg{fill:rgba(2,6,23,.92);stroke:rgba(56,189,248,.24);rx:11;ry:11}

  <script>
    function sourceParam() {
      return new URLSearchParams(location.search).get("from") || "";
    }
    function sourceHomeHref() {
      const from = sourceParam();
      if (from === "launcher") return "./launcher.html?stay=1&from=report_viewer";
      if (from === "newui") return "./ui/P1008_WARROOM_COMMAND_CENTER_v24.html?from=report_viewer&ts=" + Date.now();
      if (from === "oldui") return "./index_p1008_v7.html?from=report_viewer&ts=" + Date.now();
      return "./launcher.html?stay=1&from=report_viewer";
    }
    const P1008_IMMERSIVE_KEY = "p1008_immersive_mode";
    function readImmersivePref() {
      try { return localStorage.getItem(P1008_IMMERSIVE_KEY) === "1"; } catch (err) { return false; }
    }
    function writeImmersivePref(active) {
      try { localStorage.setItem(P1008_IMMERSIVE_KEY, active ? "1" : "0"); } catch (err) {}
    }
    function immersiveRequested() {
      return new URLSearchParams(window.location.search).get("fs") === "1" || readImmersivePref();
    }
    function immersiveActive() {
      return document.body.classList.contains("p1008-focus-mode") || immersiveRequested();
    }
    function applyImmersiveMode(active, persist = true) {
      document.body.classList.toggle("p1008-focus-mode", active);
      if (persist) writeImmersivePref(active);
      updateFullscreenButton();
    }
    function withImmersive(href) {
      const url = new URL(href, window.location.href);
      if (immersiveActive()) url.searchParams.set("fs", "1");
      else url.searchParams.delete("fs");
      return url.href;
    }
    function withSource(href) {
      const from = sourceParam();
      const url = new URL(href, window.location.href);
      if (from) url.searchParams.set("from", from);
      return withImmersive(url.href);
    }
    function goMainProgram(event) {
      if (event) event.preventDefault();
      window.location.assign(withImmersive(sourceHomeHref()));
    }
    async function toggleFullscreen() {
      const next = !document.body.classList.contains("p1008-focus-mode");
      if (!next && document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (err) {}
      }
      applyImmersiveMode(next, true);
    }
    function updateFullscreenButton() {
      const btn = document.getElementById("fullscreen-toggle");
      if (!btn) return;
      const active = Boolean(document.body.classList.contains("p1008-focus-mode") || document.fullscreenElement);
      btn.disabled = false;
      btn.textContent = active ? "退出全螢幕" : "全螢幕";
      btn.setAttribute("aria-pressed", active ? "true" : "false");
      btn.title = "切換戰情室沉浸模式；內部跳轉會保持此狀態";
    }
    function syncSourceLinks() {
      if (immersiveRequested()) document.body.classList.add("p1008-focus-mode");
      const reports = document.getElementById("back-reports");
      const home = document.getElementById("back-home");
      if (reports) reports.setAttribute("href", withSource("./reports.html"));
      if (home) home.setAttribute("href", sourceHomeHref());
      syncImmersiveLinks();
      updateFullscreenButton();
    }
    function syncImmersiveLinks() {
      document.querySelectorAll("a[href]").forEach((link) => {
        const raw = link.getAttribute("href");
        if (!raw || /^(#|mailto:|tel:|javascript:)/i.test(raw)) return;
        const url = new URL(raw, window.location.href);
        if (url.protocol === window.location.protocol && url.host === window.location.host) {
          link.setAttribute("href", withImmersive(raw));
        }
      });
    }
    document.addEventListener("click", (event) => {
      const link = event.target.closest?.("a[href]");
      if (!link) return;
      const raw = link.getAttribute("href");
      if (!raw || /^(#|mailto:|tel:|javascript:)/i.test(raw)) return;
      const url = new URL(raw, window.location.href);
      if (url.protocol === window.location.protocol && url.host === window.location.host) {
        link.setAttribute("href", withImmersive(raw));
      }
    }, true);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("DOMContentLoaded", syncSourceLinks);
  </script>
</head>

  <script>
    const LOCAL_REPORT_CATALOG = [
      {
        id: "P1008_DECISION_AUDIT_REPORT_STANDARD_20260701",
        date: "2026-07-01",
        title: "P1008 戰報輸出標準：持股風險與決策邏輯稽核",
        tags: ["戰報標準", "持股風險", "決策邏輯", "actionable:false"],
        md: "P1008_DECISION_AUDIT_REPORT_STANDARD_20260701.md"
      },
      {
        id: "P1008_DATABASE_KPI_GUIDE_20260629",
        date: "2026-06-29",
        title: "P1008 數據庫架構與 KPI 說明",
        tags: ["資料治理", "KPI", "計算範例", "actionable:false"],
        md: "P1008_DATABASE_KPI_GUIDE_20260629.md"
      },
      {
        id: "P1008_BLACK_SWAN_BACKTEST_LOGIC_20260629",
        date: "2026-06-29",
        title: "P1008 黑天鵝事件與回測引擎邏輯",
        tags: ["黑天鵝", "回測引擎", "流程圖", "actionable:false"],
        md: "P1008_BLACK_SWAN_BACKTEST_LOGIC_DECISION_TREE_20260629.md"
      },
      {
        id: "P1008_MACRO_FRAMEWORK_20260618",
        date: "2026-06-18",
        title: "戰情室宏觀框架：六大力量交織分析與行動方案",
        tags: ["宏觀框架", "來源分級", "actionable:false"],
        md: "戰情室宏觀框架：六大力量交織分析與行動方案.md"
      },
      {
        id: "P1008_DAILY_20260617",
        date: "2026-06-17",
        title: "戰情室日報 2026-06-17",
        tags: ["日報", "資料快照", "actionable:false"],
        md: "戰情室日報_2026-06-17.md"
      }
    ];
    // -------------------------
    // Safe subset markdown renderer (headings, bold, lists, simple pipe tables)
    // -------------------------
    function escapeHtml(s){
      return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }

    function formatInline(s){
      return escapeHtml(s)
        .replace(/`([^`]+?)`/g, "<code>$1</code>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function splitTableRow(line){
      return line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
    }

    function renderFlowchart(code){
      const nodes = new Map();
      const edges = [];
      const explicitRoots = [];
      const parseNode = token => {
        const trimmed = token.trim();
        const match = trimmed.match(/^([A-Za-z0-9_]+)([\[\{\(\<])(.+)([\]\}\)\>])$/);
        if(match){
          const marker = match[2];
          const type = marker === "{" ? "decision" : marker === "(" ? "result" : marker === "<" ? "event" : "action";
          return { id: match[1], label: match[3], type };
        }
        const id = trimmed.replace(/[^A-Za-z0-9_]/g, "") || trimmed;
        return { id, label: nodes.get(id)?.label || trimmed, type: nodes.get(id)?.type || "action" };
      };
      const keepNode = node => {
        if(!nodes.has(node.id)) nodes.set(node.id, node);
        else nodes.set(node.id, { ...nodes.get(node.id), ...node });
        return nodes.get(node.id);
      };
      const edgeTone = label => {
        const upper = String(label || "").toUpperCase();
        if(upper.includes("YES") || upper.includes("通過") || upper.includes("是")) return "yes";
        if(upper.includes("NO") || upper.includes("否") || upper.includes("不通過") || upper.includes("阻斷")) return "no";
        if(upper.includes("OPTION") || upper.includes("觀察") || upper.includes("重審") || upper.includes("暫停")) return "option";
        return "";
      };
      const labelText = value => String(value || "").replace(/^YES:\s*/i, "YES：").replace(/^NO:\s*/i, "NO：").replace(/^Option:\s*/i, "Option：");
      const escapeAttr = s => escapeHtml(s).replace(/'/g,"&#39;");

      code.replace(/\r\n/g,"\n").split("\n").forEach(raw => {
        const line = raw.trim();
        if(!line || line.startsWith("#")) return;
        if(line.startsWith("root:")){
          const rootNode = keepNode(parseNode(line.slice(5).trim()));
          explicitRoots.push(rootNode.id);
          return;
        }
        if(!line.includes("->")) return;
        const match = line.match(/^(.+?)\s*(?:--\s*(.+?)\s*-->|->)\s*(.+)$/);
        if(!match) return;
        const from = keepNode(parseNode(match[1]));
        const to = keepNode(parseNode(match[3]));
        edges.push({ from: from.id, to: to.id, label: match[2] ? match[2].trim() : "→" });
      });

      if(!edges.length){
        return `<pre><code>${escapeHtml(code)}</code></pre>`;
      }

      const children = new Map();
      const indegree = new Map();
      nodes.forEach((_, id) => { children.set(id, []); indegree.set(id, 0); });
      edges.forEach(edge => {
        children.get(edge.from)?.push(edge);
        indegree.set(edge.to, (indegree.get(edge.to) || 0) + 1);
      });

      const roots = explicitRoots.length
        ? explicitRoots
        : Array.from(nodes.keys()).filter(id => (indegree.get(id) || 0) === 0);
      const rootIds = roots.length ? roots : [edges[0].from];

      const layout = new Map();
      const positioned = new Set();
      let leafCursor = 0;
      const hGap = 245, vGap = 104, nodeW = 180, nodeH = 58, marginX = 28, marginY = 28;
      let maxDepth = 0;
      const place = (id, depth, trail = new Set()) => {
        maxDepth = Math.max(maxDepth, depth);
        if(positioned.has(id)) return layout.get(id).y;
        if(trail.has(id)){
          const y = leafCursor++ * vGap;
          layout.set(id, { x: depth * hGap, y, depth });
          positioned.add(id);
          return y;
        }
        const nextTrail = new Set(trail);
        nextTrail.add(id);
        const out = (children.get(id) || []).filter(edge => nodes.has(edge.to));
        let y;
        if(!out.length){
          y = leafCursor++ * vGap;
        } else {
          const ys = out.map(edge => place(edge.to, depth + 1, nextTrail));
          y = ys.reduce((sum, value) => sum + value, 0) / ys.length;
        }
        layout.set(id, { x: depth * hGap, y, depth });
        positioned.add(id);
        return y;
      };
      rootIds.forEach(root => place(root, 0));

      const width = marginX * 2 + maxDepth * hGap + nodeW + 36;
      const height = Math.max(260, marginY * 2 + Math.max(leafCursor - 1, 1) * vGap + nodeH + 36);
      const nodeRectClass = id => {
        const type = nodes.get(id)?.type || "action";
        const outCount = (children.get(id) || []).length;
        if(type === "event") return "tree-node-rect tree-node-event";
        if(type === "decision") return "tree-node-rect tree-node-decision";
        if(type === "result") return "tree-node-rect tree-node-result";
        if(outCount === 0) return "tree-node-rect tree-node-final";
        return "tree-node-rect";
      };
      const nodeTextClass = id => {
        const type = nodes.get(id)?.type || "action";
        const outCount = (children.get(id) || []).length;
        if(type === "decision") return "tree-node-text tree-node-decision-text";
        if(type === "result") return "tree-node-text tree-node-result-text";
        if(outCount === 0) return "tree-node-text tree-node-final-text";
        return "tree-node-text";
      };
      const nodeSvg = Array.from(layout.entries()).map(([id, pos]) => {
        const x = marginX + pos.x, y = marginY + pos.y;
        return `
          <g>
            <rect class="${nodeRectClass(id)}" x="${x}" y="${y}" width="${nodeW}" height="${nodeH}"></rect>
            <foreignObject x="${x}" y="${y}" width="${nodeW}" height="${nodeH}">
              <div xmlns="http://www.w3.org/1999/xhtml" class="${nodeTextClass(id)}">${formatInline(nodes.get(id)?.label || id)}</div>
            </foreignObject>
          </g>
        `;
      }).join("");
      const edgeSvg = edges.filter(edge => layout.has(edge.from) && layout.has(edge.to)).map((edge, idx) => {
        const a = layout.get(edge.from), b = layout.get(edge.to);
        const x1 = marginX + a.x + nodeW;
        const y1 = marginY + a.y + nodeH / 2;
        const x2 = marginX + b.x;
        const y2 = marginY + b.y + nodeH / 2;
        const midX = x1 + Math.max(36, (x2 - x1) / 2);
        const path = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
        const lx = midX - 44;
        const ly = (y1 + y2) / 2 - 12;
        const tone = edgeTone(edge.label);
        const cleanLabel = labelText(edge.label);
        return `
          <path class="tree-edge" marker-end="url(#arrowHead)" d="${path}"></path>
          ${cleanLabel !== "→" ? `
            <g>
              <rect class="tree-label-bg" x="${lx}" y="${ly}" width="88" height="24"></rect>
              <text class="tree-label-text ${tone ? `tree-label-${tone}` : ""}" x="${midX}" y="${ly + 16}" text-anchor="middle">${escapeHtml(cleanLabel)}</text>
            </g>
          ` : ""}
        `;
      }).join("");

      return `
        <div class="flowchart-wrap" role="img" aria-label="戰情室流程圖">
          <div class="flowchart-title">決策樹</div>
          <svg class="decision-tree-svg" viewBox="0 0 ${width} ${height}" aria-label="決策樹圖">
            <defs>
              <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
                <path class="tree-edge-marker" d="M 0 0 L 8 4 L 0 8 z"></path>
              </marker>
            </defs>
            ${edgeSvg}
            ${nodeSvg}
          </svg>
          <div class="flow-note">中文備註：此圖為判讀流程，不代表交易流程；正式輸出維持 actionable:false。</div>
        </div>
      `;
    }

    function renderCodeBlock(lang, code){
      const safeLang = String(lang || "").trim().toLowerCase();
      if(safeLang === "flowchart") return renderFlowchart(code);
      if(safeLang === "formula"){
        return `<div class="formula-block">${escapeHtml(code)}</div>`;
      }
      const label = safeLang ? `<div class="code-label">${escapeHtml(safeLang)}</div>` : "";
      return `${label}<pre><code>${escapeHtml(code)}</code></pre>`;
    }

    function resolveMarkdownAsset(mdPath, src){
      const raw = String(src || "").trim();
      if(!raw) return "";
      if(/^(https?:|data:|blob:|file:|#|\/)/i.test(raw)) return raw;
      const base = String(mdPath || "");
      const baseDir = base.includes("/") ? base.slice(0, base.lastIndexOf("/") + 1) : "./";
      try{
        return new URL(raw, new URL(baseDir, location.href)).href;
      }catch(_){
        return baseDir + raw;
      }
    }

    function renderMarkdownImage(line, mdPath){
      const match = line.match(/^!\[([^\]]*)\]\((\S+?)(?:\s+["'][^"']*["'])?\)$/);
      if(!match) return "";
      const alt = match[1] || "report chart";
      const src = resolveMarkdownAsset(mdPath, match[2]);
      return `<figure class="chart-figure"><img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" /><figcaption>${escapeHtml(alt)}</figcaption></figure>`;
    }

    function mdToHtml(md, mdPath=""){
      const lines = md.replace(/\r\n/g,"\n").split("\n");
      let html = "", listType=null, inTable=false, tableBuf=[], inCode=false, codeLang="", codeBuf=[];

      const flushList=()=>{ if(listType){ html+=`</${listType}>`; listType=null; } };
      const startList=(type)=>{ if(listType !== type){ flushList(); html+=`<${type}>`; listType=type; } };

      const flushTable=()=>{
        if(!inTable) return;
        const rows = tableBuf.filter(l=>l.trim().startsWith("|"));
        if(rows.length < 2){ inTable=false; tableBuf=[]; return; }

        const head = splitTableRow(rows[0]);
        html += "<table><thead><tr>" + head.map(h=>`<th>${formatInline(h)}</th>`).join("") + "</tr></thead><tbody>";

        const start = /^[:\-\s|]+$/.test(rows[1]) ? 2 : 1;
        for(let i=start;i<rows.length;i++){
          const cols = splitTableRow(rows[i]);
          html += "<tr>" + cols.map(c=>`<td>${formatInline(c)}</td>`).join("") + "</tr>";
        }
        html += "</tbody></table>";
        inTable=false; tableBuf=[];
      };

      const flushCode=()=>{
        if(!inCode) return;
        html += renderCodeBlock(codeLang, codeBuf.join("\n"));
        inCode=false; codeLang=""; codeBuf=[];
      };

      for(const raw of lines){
        const line = raw.trimEnd();
        const trimmed = line.trim();

        if(inCode){
          if(trimmed.startsWith("```")) { flushCode(); }
          else { codeBuf.push(raw); }
          continue;
        }

        const fence = trimmed.match(/^```(.*)$/);
        if(fence){
          flushList(); flushTable();
          inCode = true;
          codeLang = fence[1].trim();
          codeBuf = [];
          continue;
        }

        if(!trimmed){
          flushList(); flushTable();
          continue;
        }

        if(trimmed.startsWith("|") && trimmed.includes("|")){
          inTable = true;
          tableBuf.push(line);
          continue;
        } else {
          flushTable();
        }

        const h1=line.match(/^#\s+(.+)/);
        const h2=line.match(/^##\s+(.+)/);
        const h3=line.match(/^###\s+(.+)/);
        if(h1){ flushList(); html += `<h1>${formatInline(h1[1])}</h1>`; continue; }
        if(h2){ flushList(); html += `<h2>${formatInline(h2[1])}</h2>`; continue; }
        if(h3){ flushList(); html += `<h3>${formatInline(h3[1])}</h3>`; continue; }

        const imageHtml = renderMarkdownImage(trimmed, mdPath);
        if(imageHtml){
          flushList(); flushTable();
          html += imageHtml;
          continue;
        }

        const unordered=line.match(/^[-*]\s+(.+)/);
        if(unordered){
          startList("ul");
          html += `<li>${formatInline(unordered[1])}</li>`;
          continue;
        }

        const ordered=line.match(/^\d+\.\s+(.+)/);
        if(ordered){
          startList("ol");
          html += `<li>${formatInline(ordered[1])}</li>`;
          continue;
        }

        flushList();
        html += `<p>${formatInline(line)}</p>`;
      }

      flushCode(); flushList(); flushTable();
      return html;
    }

                <div class="text-xs text-slate-400 font-black tracking-widest uppercase">GM misconception</div>
                <div class="mt-2 text-lg font-black text-sky-200">Pass-through dilution</div>
                <div class="mt-2 text-sm text-slate-300 leading-relaxed">
                  In AI server pass-through accounting, high ASP components can dilute GM mathematically.
                  Slight GM drop is not necessarily value deterioration; validate with op margin and net profit quality.
                </div>
              </div>

              <div class="kpi">
                <div class="text-xs text-slate-400 font-black tracking-widest uppercase">Asset efficiency</div>
                <div class="mt-2 text-lg font-black text-amber-200">TAT up</div>
                <div class="mt-2 text-sm text-slate-300 leading-relaxed">
                  Report cites total asset turnover rising from ~0.37 to ~0.52, improving revenue per asset.
                  This supports ROE structurally.
                </div>
              </div>

              <div class="kpi">
                <div class="text-xs text-slate-400 font-black tracking-widest uppercase">Forward PEG</div>
                <div class="mt-2 text-lg font-black text-purple-200">Time-misalignment fix</div>
                <div class="mt-2 text-sm text-slate-300 leading-relaxed">
                  Stock price leads (future 6~12m) while EPS growth is forecast.
                  Using past 1y price gain vs future EPS growth directly causes misalignment and can "wrongly kill" winners.
                  Use forward PEG calibration to avoid selling too early.
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="good">
                <div class="font-black text-emerald-200 mb-2">Scenario A: GM down but leverage up</div>
                <div class="text-emerald-100 text-sm leading-relaxed">
                  If GM dips slightly but op margin and operating profit growth outpace revenue, treat as value-chain upgrade not deterioration.
                  Avoid premature downgrade.
                </div>
              </div>

              <div class="warn">
                <div class="font-black text-red-200 mb-2">Scenario B: overheat confirmed after forward PEG</div>
                <div class="text-red-100 text-sm leading-relaxed">
                  If forward PEG calibration still flags overheat (price truly over-discounting), prefer TRIM/REDUCE at high zone to protect principal.
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="note">
              <div class="font-black text-sky-200 mb-2">Apply to war-room (order)</div>
              <ol class="list-decimal pl-6 space-y-1 text-sky-100 text-sm">
                <li>Check operating leverage: op profit growth vs revenue, op margin direction.</li>
                <li>Check asset efficiency: TAT trend as ROE support.</li>
                <li>Finally use forward PEG calibration to avoid time-misalignment mistakes.</li>
              </ol>
            </div>
          `);
        }

      }catch(e){
        const mdPath = item?.md ? "./reports/" + item.md : "";
        const htmlPath = item?.html ? "./reports/" + item.html : "";
        const fileMode = location.protocol === "file:";
        contentEl.innerHTML = `
          <div class="warn">
            <div class="font-black mb-2">載入失敗</div>
            <div class="text-sm">${escapeHtml(String(e && (e.message||e) || e))}</div>
            <div class="text-xs mt-2 text-slate-300">
              ${fileMode
                ? "不支援 file:// 互動模式。"
                : "請檢查：1) 套件內 reports/ 是否存在 2) 報告檔名是否完全一致 3) 是否用 http/https 開啟"}
            </div>
            <div class="mt-4 flex flex-wrap gap-2">
              ${htmlPath ? `<a class="px-3 py-2 rounded-lg border border-emerald-500/40 bg-emerald-950/35 text-emerald-100 font-black" href="${escapeHtml(withSource(htmlPath))}">直接開啟 HTML 戰報</a>` : ""}
              ${mdPath ? `<a class="px-3 py-2 rounded-lg border border-sky-500/40 bg-sky-950/35 text-sky-100 font-black" href="${escapeHtml(mdPath)}">直接開啟 Markdown 檔</a>` : ""}
              <a class="px-3 py-2 rounded-lg border border-slate-600 bg-slate-900 text-slate-100 font-black" href="${escapeHtml(withSource('./reports/generated/latest_report.html'))}">最新本機戰報 HTML</a>
            </div>
            <div class="text-xs mt-3 text-slate-300">
              請回到套件根目錄，雙擊 <code>P1008_APP.bat</code>，再由 Launcher 進入研報庫。
            </div>
          </div>`;
      }
    }

    async function boot(){
      if (location.protocol === "file:") {
        contentEl.innerHTML = `<div class="warn">
          <div class="font-black mb-2">不支援 file:// 互動模式</div>
          <div class="text-sm">研報閱讀器不會在直接雙擊模式載入 manifest 或報告內容。</div>
          <div class="text-sm mt-3">請回到套件根目錄，雙擊 <code>P1008_APP.bat</code>，再由 Launcher 進入研報庫。</div>
        </div>`;
        return;
      }
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const catalog = await loadReportCatalog();
      item = catalog.find(x=>x.id===id) || catalog[0];
      setReportMeta(item);
      run();
    }

    boot();
  </script>
</body>
</html>
