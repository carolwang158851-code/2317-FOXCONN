            render() {
                if (this.state.hasError) return (<div className="min-h-screen bg-slate-900 flex items-center justify-center p-8"><div className="bg-red-950/80 border border-red-500 p-8 rounded-xl max-w-3xl w-full"><h1 className="text-3xl font-black text-red-400 mb-4">系統運算中斷 (System Error)</h1><pre className="bg-black/50 p-4 rounded text-sm text-red-300 font-mono whitespace-pre-wrap">{this.state.errorInfo?.toString()}</pre></div></div>);

        const RefreshIcon = ({ className = "" }) => <svg className={`w-5 h-5 ${className}`} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>;
        const DataBadge = ({ type }) => ( type === 'api' ? <strong className="ml-2 inline-flex items-center gap-1 px-2 py-1 rounded text-[11px] md:text-sm font-black tracking-wider bg-emerald-950/80 text-emerald-400 border border-emerald-800 shadow-sm" title="API抓取即時數據"><svg className="w-3 h-3 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>API即時</strong> : <strong className="ml-2 inline-flex items-center gap-1 px-2 py-1 rounded text-[11px] md:text-sm font-black tracking-wider bg-amber-950/80 text-amber-400 border border-amber-800 shadow-sm" title="本機設定值"><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>本機/手動</strong> );

        const ReportModal = ({ isOpen, onClose }) => {
            const [activeReportId, setActiveReportId] = useState(null);
            useEffect(() => { if (!isOpen) setActiveReportId(null); }, [isOpen]);
            if (!isOpen) return null;

            const finDataList = [{ q: '24 Q1', rev: '13,239', gm: '6.32%', tax: '7,636', eps: '1.59' }, { q: '24 Q2', rev: '15,505', gm: '6.42%', tax: '9,455', eps: '2.53' }, { q: '24 Q3', rev: '18,545', gm: '6.19%', tax: '12,308', eps: '3.55' }, { q: '24 Q4', rev: '21,305', gm: '6.15%', tax: '10,797', eps: '3.34' }, { q: '25 Q1', rev: '16,443', gm: '6.11%', tax: '13,287', eps: '3.03' }, { q: '25 Q2', rev: '17,934', gm: '6.33%', tax: '15,613', eps: '3.19' }, { q: '25 Q3', rev: '20,589', gm: '6.35%', tax: '20,863', eps: '4.15' }, { q: '25 Q4', rev: '26,063', gm: '5.88%', tax: '28,648', eps: '3.25', hl: true }];
            const chipsData = [{ date: '4/22', sbl: '+4298', foreign: '+40,064', foreignPct: '36.73%' }, { date: '4/21', sbl: '-1761', foreign: '+15,363', foreignPct: '36.42%' }, { date: '4/20', sbl: '-6777', foreign: '+9,876', foreignPct: '36.31%' }];
            
            const reports = [
                { id: 'roe_ems', title: '報告 I：EMS 產業 ROE 深度解析', date: '2026-04-10', summary: '探討高負債是否虛增 ROE，以及為何 10% 是重資產代工業的天險。', content: (<div className="space-y-5 text-lg"><h3 className="text-2xl font-black text-emerald-500 border-b border-slate-700 pb-2">負債虛增 ROE？鴻海的「高負債」是壞事嗎？</h3><p className="text-slate-300">鴻海憑藉強大供應鏈議價能力，負債多為應付帳款(無息)。配合 ROA 不墜，這屬於良性槓桿。</p><h3 className="text-2xl font-black text-emerald-500 border-b border-slate-700 pb-2 mt-6">實戰情推演：為何 10% 是天險？11.5% 強烈加碼？</h3><p className="text-slate-300">在 AI 伺服器毛利稀釋下，ROE 要達 11.5% 意味著資產週轉率必須暴增至 2.0 次，這代表產能滿載的超級爆發期，系統必將授權強勢追擊。</p></div>) },
                { id: 'op_leverage', title: '報告 II：破解毛利迷思與營運槓桿效應', date: '2026-04-10', summary: '分析鴻海為何在毛利率微降的情況下，營業利益卻大幅飆升。', content: (<div className="space-y-5 text-lg"><h3 className="text-2xl font-black text-emerald-500 border-b border-slate-700 pb-2">破解毛利率迷思：營運槓桿 (Operating Leverage)</h3><p className="text-slate-300">高單價 GPU 採 Pass-through 認列產生了「數學稀釋效應」。但 2025 年營收年增 18%，營業淨利年增高達 29%，證明強大的營運槓桿推升了實質附加價值。</p></div>) },
                { id: 'real_data', title: '報告 VIII：營收稅費不對稱性與動態降評', date: '2026-04-27', summary: '統計學檢定揭露 Pillar Two 稅率吞噬利潤的殘酷真相與防禦模型。', content: (<div className="space-y-5 text-lg"><h3 className="text-2xl font-black text-emerald-500 border-b border-slate-700 pb-2">營收與所得稅的「不對稱暴增」</h3><p className="text-slate-300">2025 Q4 稅金營收比跳升至 1.099% (Z-score 3.66)。系統已導入動態 Tax Drag 校正，當 Z ≧ 2.0 時，強制精準扣減 EPS 並限制加碼力道，嚴防獲利虛胖。</p></div>) }
            ];

            const sortedReports = [...reports].sort((a, b) => new Date(b.date) - new Date(a.date));
            const activeReport = reports.find(r => r.id === activeReportId);

            return (

                    <div className="bg-slate-900/95 border border-slate-700 w-full max-w-6xl max-h-[95vh] h-[95vh] rounded-2xl flex flex-col shadow-[0_0_60px_rgba(0,0,0,0.9)]" onClick={e => e.stopPropagation()}>

                            <button onClick={() => activeReportId ? setActiveReportId(null) : onClose()} className="text-slate-400 hover:text-red-400 p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-600"><CloseIcon /></button>

                        <div className="px-6 md:px-8 py-5 border-b border-slate-700 flex justify-between items-center bg-slate-800/50 rounded-t-2xl flex-shrink-0">
                            <h2 className="text-xl md:text-3xl font-black text-sky-400 flex items-center gap-4"><BookIcon /> 動態部位控管與五大戰略 SOP</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-red-400 p-2 bg-slate-800 rounded-xl hover:bg-slate-700 border border-slate-600"><CloseIcon /></button>
                        </div>
                        <div className="p-6 md:p-10 overflow-y-auto space-y-10 text-base md:text-lg text-slate-300 leading-relaxed custom-scrollbar">
                            <div className="space-y-4">
                                <h3 className="text-2xl font-black text-white flex items-center gap-3 border-b border-slate-700 pb-3"><strong className="text-sky-500">壹、</strong> 雙引擎動態加減碼 (Dual-Engine Position Sizing)</h3>
                                <ul className="list-none space-y-5">
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-emerald-900/80 text-emerald-400 border border-emerald-600 shadow-sm whitespace-nowrap">STRONG_ADD</strong> <div><strong className="text-emerald-400 text-xl">強烈加碼 (投入 50%)：</strong> 預估 EPS 成長 &ge; 15%，或 EPS 成長 &ge; 10% 且 ROE &ge; 11.5%。</div></li>
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-green-900/80 text-green-400 border border-green-600 shadow-sm whitespace-nowrap">ADD</strong> <div><strong className="text-green-400 text-xl">分批加碼 (投入 30%)：</strong> 預估 EPS 成長 &ge; 10%，或 EPS 成長 &ge; 5% 且 ROE &ge; 10.0%。</div></li>
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-teal-900/80 text-teal-400 border border-teal-600 shadow-sm whitespace-nowrap">BUY (突圍/建倉)</strong> <div><strong className="text-teal-400 text-xl">基本建倉 / 動能突圍 (投入 30%)：</strong> 處於低估區且動能平穩；或處於「合理區」但 ROE 與 EPS 達頂級爆發標準，發動右側突圍買進。</div></li>
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-yellow-900/80 text-yellow-400 border border-yellow-600 shadow-sm whitespace-nowrap">HOLD</strong> <div><strong className="text-yellow-400 text-xl">合理區按兵不動：</strong> PB 位於合理區間 (非安全區、非高估區) 且無頂級突圍 &rarr; 純領息觀望。</div></li>
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-orange-900/80 text-orange-400 border border-orange-600 shadow-sm whitespace-nowrap">TRIM</strong> <div><strong className="text-orange-400 text-xl">預防性減碼：</strong> 高估區且動能放緩/PEG溢價/大戶退場 &rarr; 減碼 30%。</div></li>
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-red-900/80 text-red-400 border border-red-600 shadow-sm whitespace-nowrap">SELL / REDUCE</strong> <div><strong className="text-red-400 text-xl">清倉：</strong> 高估區且雙殺衰退 (例如 EPS &lt; 5% 或 ROE &lt; 10) &rarr; 強制避險。</div></li>
                                    <li className="flex items-start gap-4"><strong className="px-3 py-1.5 rounded text-sm font-black bg-slate-800 text-slate-300 border border-slate-600 shadow-sm whitespace-nowrap">BLOCK</strong> <div><strong className="text-slate-300 text-xl">攔截：</strong> 落入便宜區但觸發配息陷阱/PEG/稅基嚴重風險 &rarr; 禁止加碼。</div></li>

                                            <SleekNeedleGauge title="指標 C: 夏普(品質)" value={decisionEngine.metricC} target={0.5} unit=" pt" min={-5.0} max={10.0} isPass={decisionEngine.metricC >= 0.5} formula="(4Q毛利 - 5Y毛利) ÷ 5Y標準差" />
                                            <SleekNeedleGauge title="指標 D: FWD EPS" value={decisionEngine.metricD * 100} target={15.0} unit="%" min={-10.0} max={40.0} isPass={decisionEngine.metricD >= 0.15} formula="(未來12M EPS ÷ 實際TTM EPS) - 1" />
                                            <SleekNeedleGauge title="Risk: 發放率" value={p.payoutRatio} target={50.0} unit="%" min={0} max={100.0} isPass={p.payoutRatio >= 50.0} formula="防守紅線: 每股股息 ÷ 每股盈餘" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col gap-8 w-full">
                                <div className="glass-panel p-6 md:p-8 rounded-2xl w-full shadow-xl">
                                    <div className="flex justify-between items-center mb-5 border-b border-slate-700 pb-3"><h3 className="text-xl md:text-2xl font-black text-white flex items-center gap-2 tracking-widest"><ActivityIcon />Decision Tree (動態路徑)</h3></div>
                                    <div className="bg-[#040814] rounded-xl border border-[#1e293b] shadow-inner p-4 decision-tree-viewport custom-scrollbar">
                                        <MermaidChart activeNodes={decisionEngine.activeNodes} setTooltipInfo={setTooltipInfo} params={params} dynamicBuyThreshold={decisionEngine.dynamicBuyThreshold} pbCurrent={decisionEngine.pbCurrent} metricD={decisionEngine.metricD} roeCurrent={decisionEngine.roeCurrent} riskTol={decisionEngine.riskTol} priceGrowthPct={decisionEngine.priceGrowthPct} isLiquiditySafe={decisionEngine.isLiquiditySafe} isTaxSafe={decisionEngine.isTaxSafe} blockedByPayout={decisionEngine.blockedByPayout} />
                                    </div>
                                </div>
                                <div className="glass-panel p-6 md:p-8 rounded-2xl shadow-xl flex flex-col w-full">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 border-b border-slate-700 pb-4 gap-3 shrink-0">
                                        <h3 className="text-xl md:text-2xl font-black text-emerald-400 flex items-center gap-2 tracking-widest"><svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>Chain Search (決策軌跡日誌)</h3>
                                        <div className="relative w-full md:w-auto"><div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><SearchIcon /></div><input type="text" placeholder="輸入 'Tax' 或 'TRUE'..." className="bg-[#020617] border border-[#1e293b] text-slate-300 text-sm md:text-base rounded-xl focus:ring-emerald-500 focus:border-emerald-500 block w-full pl-10 p-3" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} /></div>
                                    </div>
                                    <div className="overflow-x-auto overflow-y-auto bg-[#040814] rounded-xl border border-[#1e293b] shadow-inner w-full max-h-[500px] custom-scrollbar">
                                        <table className="w-full text-left text-sm md:text-base num-font whitespace-nowrap table-fixed min-w-[800px]">
                                            <thead className="sticky top-0 bg-[#040814] z-10 border-b border-[#1e293b]"><tr className="text-slate-400 text-sm md:text-base"><th className="p-4 pl-5 font-bold w-[12%] uppercase tracking-wider">Step</th><th className="p-4 font-bold w-[25%] uppercase tracking-wider">Rule</th><th className="p-4 text-emerald-500 font-bold w-[15%] uppercase tracking-wider">LHS</th><th className="p-4 text-center font-bold w-[8%] uppercase tracking-wider">OP</th><th className="p-4 text-amber-500 font-bold w-[15%] uppercase tracking-wider">RHS</th><th className="p-4 text-center font-bold w-[8%] uppercase tracking-wider">Pass</th><th className="p-4 font-bold whitespace-normal w-auto uppercase tracking-wider">Message</th></tr></thead>
                                            <tbody>
                                                {filteredChain.length > 0 ? filteredChain.map((c, i) => (
                                                    <tr key={i} className={c.step === 'Final' ? 'bg-sky-900/20 border-b border-sky-800/50' : 'border-b border-[#0f172a] hover:bg-[#0f172a] transition-colors'}>
                                                        <td className={`p-4 pl-5 font-bold ${c.step === 'Final' ? 'text-sky-400 text-base' : 'text-slate-500 text-sm'}`}>[{c.step}]</td>
                                                        <td className={`p-4 pr-3 font-black truncate ${c.step === 'Final' ? 'text-sky-300 text-base' : 'text-sky-500'}`} title={c.rule}>{c.rule}</td>
                                                        <td className="p-4 pr-3 text-emerald-400/80 font-bold truncate">{c.lhs_value}</td>
                                                        <td className="p-4 px-2 text-center text-slate-500 font-bold">{c.op}</td>
                                                        <td className="p-4 pr-3 text-amber-400/80 font-bold truncate">{c.rhs_value}</td>
                                                        <td className="p-4 px-2 text-center">{c.pass ? <strong className="bg-[#052e16] text-green-400 px-3 py-1.5 rounded-lg border border-green-800 text-xs md:text-sm font-black">TRUE</strong> : <strong className="bg-[#450a0a] text-red-400 px-3 py-1.5 rounded-lg border border-red-800 text-xs md:text-sm font-black">FALSE</strong>}</td>
                                                        <td className={`p-4 pr-5 tracking-wide whitespace-normal leading-relaxed ${c.step === 'Final' ? 'text-sky-200 font-bold text-base' : 'text-slate-400 text-sm'}`}>{c.msg}</td>
                                                    </tr>
                                                )) : (<tr><td colSpan="7" className="p-8 text-center text-slate-500 italic text-lg">{`No matching logs found for '${searchTerm}'`}</td></tr>)}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="lg:col-span-12 mt-10 relative border-t border-slate-800 pt-10 flex flex-col gap-8">
                            <div className="glass-panel p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-5 rounded-2xl shadow-xl border-l-[8px] border-l-sky-500">
                                <div className="flex flex-col items-start gap-2">
                                    <h2 className="text-2xl md:text-4xl font-black flex items-center gap-4 tracking-wide text-white drop-shadow-[0_0_12px_rgba(255,255,255,0.3)]"><ActivityIcon />歷史情境量化回測分析</h2>
                                    <p className="text-sm md:text-lg text-sky-400 font-bold tracking-[0.25em] uppercase">動態買進門檻溢價與財務攔截網深度模擬</p>
                                </div>
                                <div className="flex flex-col items-end gap-3">
                                    <div className="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-inner flex items-center gap-5 shrink-0">
                                        <div className="flex flex-col text-right">
                                            <strong className="text-xs md:text-sm text-slate-400 font-bold uppercase tracking-widest mb-1">目前資料庫來源</strong>
                                            <strong className={`text-base md:text-lg font-black flex items-center gap-2 justify-end ${csvData ? 'text-emerald-400' : 'text-sky-400'}`}>{csvData ? <><svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg> 本機記憶實盤大數據</> : <><svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 系統內建 2018-2026 模擬沙盒</>}</strong>
                                        </div>
                                        {csvData && (<button onClick={() => {if(window.confirm('確定要清除自訂回測數據，恢復為系統預設沙盒嗎？')) {setCsvData(null);}}} className="bg-red-900/50 hover:bg-red-800 text-red-400 p-2 rounded-lg border border-red-700 transition-colors" title="清除自訂資料"><svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>)}
                                    </div>
                                    <div className="flex items-center gap-3 w-full">
                                        <label className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-sky-900/30 hover:bg-sky-800/50 border border-sky-800 text-sky-400 rounded-lg cursor-pointer transition-colors shadow-inner font-bold text-sm md:text-base"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg><strong>匯入自訂歷史 CSV</strong><input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} /></label>
                                    </div>
                                </div>
                            </div>
                            <BacktestModule pb25th={p.pb25th} pb75th={p.pb75th} csvData={csvData} riskTol={decisionEngine.riskTol} />
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
