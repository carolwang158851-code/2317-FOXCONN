    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* ==========================================================================
           🛡️ 數據解析與處理模組
           ========================================================================== */
        const DAILY_COLUMNS = ['Date', 'Close', 'QuarterKey', 'BVPS_ref', 'PB_daily', 'DataSupportLevel', 'Status'];
        const MACRO_COLUMNS = ['Date', 'TWD_USD', 'VIX', 'WTI_Oil', 'US_10Y_Yield', 'Fed_Rate', 'Fed_Hike_Prob_YE', 'DXY', 'US_GDP_QoQ', 'US_CPI_YoY', 'TW_GDP_QoQ', 'TAIEX_Weekly_Chg', 'CSP_Capex_Signal', 'Hon_Hai_Rev_YoY', 'Foreign_Net_Buy', 'TW_Export_YoY', 'RiskLevel', 'RiskNote'];
        const MACRO_EVENT_COLUMNS = ['Date', 'EventType', 'EventTitle', 'Region', 'SourceTier', 'SourceName', 'SourceUrl', 'EvidenceStatus', 'RiskTag', 'BlackSwanLevel', 'RelatedMetrics', 'SummaryZh', 'DecisionImpactZh', 'Actionable'];
        const FX_TREND_COLUMNS = ['Date', 'TWD_USD', 'DXY', 'JPY_USD', 'US_10Y_Yield', 'Fed_Rate', 'BOJ_Rate', 'RateSpread_US_JP', 'FxTrend', 'FxPressureLevel', 'EPSImpactEstimateZh', 'SourceTier', 'SourceUrl', 'SummaryZh', 'Actionable'];
        const MASTER_NUMERIC_COLUMNS = ['Revenue_Q_100M', 'GrossMarginPct', 'OperatingIncome_Q_100M', 'OperatingMarginPct', 'TaxExpense_Q_1M', 'TaxRev_Pct', 'TaxRevMean_Pct', 'TaxRevStd_Pct', 'TaxZ', 'EPS_Q', 'EPS_YoY_Pct', 'EPS_TTM', 'BVPS', 'QuarterEndClose', 'CloseAdjusted', 'ROE_Annual_Pct', 'ROE_TTM_Pct', 'PB_QuarterEnd', 'PB_Adjusted', 'payoutRatio_Pct', 'CashDividend', 'DividendYield_Pct', 'FCF_Annual_100M', 'MarketCap_100M', 'FCFYield_Annual_Pct', 'ROIC_Approx_Pct', 'ROIC_Precise_Pct', 'NOPAT_Annual_100M', 'InvestedCapital_100M', 'Cash_100M', 'InterestBearingDebt_100M', 'NetDebt_100M', 'EBITDA_Approx_100M', 'DA_Est_100M', 'NetDebtToEBITDA_Approx', 'ForeignHoldRatio_Pct', 'ForeignHoldChange_Pct', 'AI_Revenue_Pct'];
        const MASTER_OPTIONAL_NUMERIC_COLUMNS = new Set(['FCF_Annual_100M', 'FCFYield_Annual_Pct', 'ForeignHoldChange_Pct']);
        const MASTER_ENUMS = {
            DataSource: ['USER_CURATED_WEB_DATA'],
            DataSupportLevel: ['L3'],
            LookaheadRisk: ['LOW'],
            ForeignHoldTrend: ['RISING', 'STABLE', 'DECLINING'],
        };
        const MACRO_ENUMS = { RiskLevel: ['NORMAL', 'CAUTION', 'SYSTEMIC'] };
        const TWSE_MARKET_HOLIDAYS = new Set(['2026-06-19']);
        const STATUS_ZH = {
            LOADING: '正在讀取及驗證資料',
            READY: '資料可供條件性顯示與計算',
            FRESH: '資料新鮮',
            STALE: '資料已過期',
            SEVERELY_STALE: '資料嚴重過期',
            DATA_MISSING: '必要資料缺失',
            DATA_INVALID: '資料格式或版本不合規',
            INSUFFICIENT_DATA: '資料不足，暫停判斷',
            STALE_DATA: '資料已過期，暫停判斷',
            CSV_AUTHORITY: '檔案版本已由 Owner 核准並以 SHA-256 鎖定',
            USER_CURATED_WEB_DATA: '內容原始來源包含使用者整理及查核的網路資料',
            RUNTIME_SNAPSHOT: '臨時即時快照，尚未核准發布',
            KEEP_DISABLED: '維持停用',
            OBSERVATION_ONLY: '僅供觀察',
        };

        function parseCSVTable(csvText) {
            if (typeof csvText !== 'string' || csvText.trim() === '') {
                return { header: [], rows: [], issues: [{ code: 'EMPTY_CSV', message: 'CSV 內容為空' }] };
            }
            const parsedRows = [];
            let row = [], cell = '', quoted = false, lineNumber = 1, rowStartLine = 1;
            const pushRow = () => {
                const values = [...row, cell].map(value => value.replace(/\r$/, '').trim());
                parsedRows.push({ values, lineNumber: rowStartLine });
                row = []; cell = ''; rowStartLine = lineNumber + 1;
            };
            for (let i = 0; i < csvText.length; i += 1) {
                const ch = csvText[i];
                if (quoted) {
                    if (ch === '"' && csvText[i + 1] === '"') { cell += '"'; i += 1; }
                    else if (ch === '"') quoted = false;
                    else { cell += ch; if (ch === '\n') lineNumber += 1; }
                } else if (ch === '"') quoted = true;
                else if (ch === ',') { row.push(cell); cell = ''; }
                else if (ch === '\n') { pushRow(); lineNumber += 1; }
                else cell += ch;
            }
            if (cell !== '' || row.length > 0) pushRow();

            const contentRows = parsedRows.filter(item => {
                const first = (item.values[0] || '').trim();
                return item.values.some(value => value !== '') && !first.startsWith('#');
            });
            if (contentRows.length < 2) {
                return { header: contentRows[0]?.values || [], rows: [], issues: [{ code: 'CSV_NO_DATA_ROWS', message: 'CSV 缺少資料列' }] };
            }
            const header = contentRows[0].values;
            const rows = contentRows.slice(1).map(item => ({
                ...item,
                object: Object.fromEntries(header.map((name, index) => [name, item.values[index] ?? ''])),
            }));
            return { header, rows, issues: [] };
        }

        function validateTable(table, config) {
            const issues = [...table.issues];
            const invalidRows = [];
            const expected = config.columns;
            if (table.header.length !== expected.length || expected.some((name, index) => table.header[index] !== name)) {
                issues.push({ code: 'SCHEMA_HEADER_MISMATCH', message: `${config.label} 表頭與核准 Schema 不一致` });
            }
            const seenKeys = new Set();
            const validRows = table.rows.filter(item => {
                const rowIssues = [];
                if (item.values.length !== expected.length) rowIssues.push(`欄數 ${item.values.length}，預期 ${expected.length}`);
                for (const field of config.required || []) {
                    if (!item.object[field]) rowIssues.push(`${field} 缺失`);
                }
                for (const field of config.dateColumns || []) {
                    const value = item.object[field];
                    if (value && !/^\d{4}-\d{2}-\d{2}$/.test(value)) rowIssues.push(`${field} 日期格式錯誤`);
                }
                for (const field of config.numericColumns || []) {
                    const value = item.object[field];
                    const missingAllowed = config.optionalNumeric?.has(field);
                    if (value === '' || value === 'N/A') {
                        if (!missingAllowed) rowIssues.push(`${field} 缺失`);
                    } else if (!Number.isFinite(Number(value))) rowIssues.push(`${field} 不是有效數值`);
                }
                for (const [field, allowed] of Object.entries(config.enums || {})) {
                    const value = item.object[field];
                    if (value && !allowed.includes(value)) rowIssues.push(`${field} 值 ${value} 未核准`);
                }
                if (config.keyColumn) {
                    const key = item.object[config.keyColumn];
                    if (seenKeys.has(key)) rowIssues.push(`${config.keyColumn} 重複`);
                    seenKeys.add(key);
                }
                if (rowIssues.length > 0) {
                    invalidRows.push({ lineNumber: item.lineNumber, key: item.object[config.keyColumn] || '', issues: rowIssues });
                    return false;
                }
                return true;
            });
            if (invalidRows.length > 0) {
                issues.push({ code: 'INVALID_ROWS_EXCLUDED', message: `${config.label} 已排除 ${invalidRows.length} 筆格式異常資料` });
            }
            return {
                valid: !issues.some(issue => issue.code === 'SCHEMA_HEADER_MISMATCH') && validRows.length > 0,
                validRows: validRows.map(item => item.object),
                invalidRows,
                issues,
            };
        }

        function validateMasterContinuity(rows) {
            const expected = [];
            for (let year = 2021; year <= 2026; year += 1) {
                const maxQuarter = year === 2026 ? 1 : 4;
                for (let quarter = 1; quarter <= maxQuarter; quarter += 1) expected.push(`${year}Q${quarter}`);
            }
            const actual = rows.map(row => row.Quarter);
            const datesValid = rows.every(row => row.EstimatedEffectiveDate >= row.QuarterEndDate);
            return {
                valid: actual.length === 21 && actual.join('|') === expected.join('|') && datesValid,
                message: datesValid ? '季度連續性與有效日期順序通過' : '有效日期早於季末日',
            };
        }

        function finiteNumber(row, field) {
            const value = row?.[field];
            if (value === '' || value === null || value === undefined || value === 'N/A') return null;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function validatedAiRevenueShare(row) {
            const value = finiteNumber(row, 'AI_Revenue_Pct');
            const denominator = String(row?.AI_Revenue_Denominator || '').trim().toUpperCase();
            const support = String(row?.DataSupportLevel || '').trim().toUpperCase();
            const allowedDenominators = new Set(['TOTAL_REVENUE', 'SERVER_REVENUE', 'CLOUD_NETWORK_REVENUE', 'OTHER']);
            const authoritySupported = /^(L1|L2|OFFICIAL|AUTHORITATIVE)/.test(support);
            return Number.isFinite(value) && allowedDenominators.has(denominator) && authoritySupported ? value : null;
        }

        function formatNumber(value, digits = 2) {
            return Number.isFinite(value) ? value.toFixed(digits) : 'N/A';
        }

        const BACKTEST_POLICY = {
            version: 'P2-QREVIEW-2026Q1-v1',
            effectiveQuarter: '2026Q1',
            status: 'OBSERVATION_ONLY',
            statusZh: '季度重審觀察版',
            sourceZh: '2317_master_v9.csv / RULE_STATUS_MANIFEST / Owner quarterly review',
            reviewTriggersZh: [
                '新一季財報正式 CSV 發布',
                '重大事件改變 AI 伺服器需求或毛利率假設',
                '總經風險升至 SYSTEMIC',
                'Owner 核准新估值門檻或 KPI 權重'
            ],
            thresholds: {
                addBasePb: 1.10,
                addAiSlope: 0.005,
                blockBasePb: 1.60,
                blockAiSlope: 0.015,
                epsSupportFloor: 10,
                epsWeakFloor: 0,
                roeSupportFloor: 11.5,
                roeWeakFloor: 10,
                opmWeakFloor: 3,
                minAddPb: 0.95,
                maxAddPb: 1.55,
                minBlockPb: 1.55,
                maxBlockPb: 2.35
            }
        };

        function clampBacktestValue(value, min, max) {
            return Number.isFinite(value) ? Math.max(min, Math.min(max, value)) : null;
        }

        function buildBacktestObservation(row, displayPB, isLatest = false) {
            const policy = BACKTEST_POLICY;
            const aiPct = validatedAiRevenueShare(row);
            const epsYoy = finiteNumber(row, 'EPS_YoY_Pct');
            const roe = finiteNumber(row, 'ROE_TTM_Pct');
            const opm = finiteNumber(row, 'OperatingMarginPct');
            const notes = [];

            let addPb = Number.isFinite(aiPct) ? policy.thresholds.addBasePb + (aiPct * policy.thresholds.addAiSlope) : null;
            let blockPb = Number.isFinite(aiPct) ? policy.thresholds.blockBasePb + (aiPct * policy.thresholds.blockAiSlope) : null;

            if (Number.isFinite(addPb) && Number.isFinite(blockPb)) {
                if (Number.isFinite(epsYoy) && epsYoy >= policy.thresholds.epsSupportFloor && Number.isFinite(roe) && roe >= policy.thresholds.roeSupportFloor) {
                    addPb += 0.05;
                    blockPb += 0.05;
                    notes.push('EPS/ROE 支撐');
                }
                if ((Number.isFinite(epsYoy) && epsYoy < policy.thresholds.epsWeakFloor) || (Number.isFinite(roe) && roe < policy.thresholds.roeWeakFloor)) {
                    addPb -= 0.05;
                    blockPb -= 0.10;
                    notes.push('獲利轉弱');
                }
                if (Number.isFinite(opm) && opm < policy.thresholds.opmWeakFloor) {
                    blockPb -= 0.05;
                    notes.push('營益率偏低');
                }
                addPb = clampBacktestValue(addPb, policy.thresholds.minAddPb, policy.thresholds.maxAddPb);
                blockPb = clampBacktestValue(blockPb, policy.thresholds.minBlockPb, policy.thresholds.maxBlockPb);
            } else {
                notes.push('AI 營收占比缺值，僅能保留歷史列');
            }

            let label = '中性觀察';
            let style = 'text-amber-400 bg-amber-900/20 border-amber-500/30';
            if (Number.isFinite(displayPB) && Number.isFinite(blockPb) && displayPB >= blockPb) {
                label = '高估觀察';
                style = 'text-rose-400 bg-rose-900/20 border-rose-500/30';
            } else if (Number.isFinite(displayPB) && Number.isFinite(addPb) && displayPB <= addPb) {
                label = '低估觀察';

        async function fetchRequiredText(url) {
            const separator = url.includes('?') ? '&' : '?';
            const response = await fetch(`${url}${separator}t=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`LOAD_FAILED: ${url} (HTTP ${response.status})`);
            return response.text();
        }

        async function fetchRequiredJson(url) {
            const text = await fetchRequiredText(url);
            try { return JSON.parse(text); }
            catch (error) { throw new Error(`JSON_INVALID: ${url}`); }
        }

        async function fetchOptionalJson(url) {
            try { return await fetchRequiredJson(url); }
            catch (error) { return null; }
        }

        async function fetchOptionalText(url) {
            try { return await fetchRequiredText(url); }
            catch (error) { return ''; }
        }

        async function fetchAppJson(url, options = {}) {
            const response = await fetch(url, {
                cache: 'no-store',
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {}),
                },
            });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; }
            catch (error) { payload = { error: text || `HTTP ${response.status}` }; }
            if (!response.ok) {
                const message = payload.message || payload.error || `HTTP ${response.status}`;
                const err = new Error(message);
                err.payload = payload;
                err.status = response.status;
                throw err;
            }
            return payload;
        }

        async function sha256Text(text) {
            if (!window.crypto?.subtle) throw new Error('HASH_UNAVAILABLE: 瀏覽器不支援 SHA-256 驗證');
            const bytes = new TextEncoder().encode(text);
            const digest = await window.crypto.subtle.digest('SHA-256', bytes);
            return Array.from(new Uint8Array(digest)).map(value => value.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function parseDateOnly(value) {
            return /^\d{4}-\d{2}-\d{2}$/.test(value || '') ? new Date(`${value}T00:00:00`) : null;
        }

        function calendarDaysSince(value, today = new Date()) {
            const date = parseDateOnly(value);
            if (!date) return null;
            const current = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            return Math.max(0, Math.floor((current - date) / 86400000));
        }

        function tradingDaysSince(value, today = new Date()) {
            const date = parseDateOnly(value);
            if (!date) return null;
            const cursor = new Date(date);
            const current = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            let count = 0;
            while (cursor < current) {
                cursor.setDate(cursor.getDate() + 1);
                const iso = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}-${String(cursor.getDate()).padStart(2, '0')}`;
                const day = cursor.getDay();
                if (day !== 0 && day !== 6 && !TWSE_MARKET_HOLIDAYS.has(iso)) count += 1;
            }
            return count;
        }

        function classifyFreshness(kind, dateValue) {
            const age = kind === 'daily' ? tradingDaysSince(dateValue) : calendarDaysSince(dateValue);
            if (age === null) return { code: 'DATA_INVALID', zh: STATUS_ZH.DATA_INVALID, age: null };
            if (kind === 'daily') {
                if (age <= 2) return { code: 'FRESH', zh: STATUS_ZH.FRESH, age };
                if (age <= 5) return { code: 'STALE', zh: STATUS_ZH.STALE, age };
                return { code: 'SEVERELY_STALE', zh: STATUS_ZH.SEVERELY_STALE, age };
            }
            if (age <= 3) return { code: 'FRESH', zh: STATUS_ZH.FRESH, age };
            if (age <= 7) return { code: 'STALE', zh: STATUS_ZH.STALE, age };
            return { code: 'SEVERELY_STALE', zh: STATUS_ZH.SEVERELY_STALE, age };
        }

        function normalizeRuntimeRow(row, columns, dataset) {
            if (!row || typeof row !== 'object') return null;
            const normalized = Object.fromEntries(columns.map(column => [column, row[column] ?? '']));
            if (!/^\d{4}-\d{2}-\d{2}$/.test(normalized.Date || '')) return null;
            if (dataset === 'daily') {
                for (const field of ['Close', 'BVPS_ref', 'PB_daily']) {
                    if (!Number.isFinite(Number(normalized[field]))) return null;
                }
                normalized.DataSupportLevel = 'RUNTIME_SNAPSHOT';
                normalized.Status = 'RUNTIME_ONLY_NOT_CSV';
            }
            if (dataset === 'macro') {
                normalized.RiskLevel = ['NORMAL', 'CAUTION', 'SYSTEMIC'].includes(normalized.RiskLevel)
                    ? normalized.RiskLevel
                    : 'CAUTION';
                normalized.RiskNote = normalized.RiskNote || '臨時快照：尚未經 Owner 核准，僅供盤中觀察。';
            }
            return normalized;
        }

        function upsertRuntimeRow(rows, runtimeRow, key = 'Date') {
            if (!runtimeRow) return rows;
            return [...rows.filter(row => row[key] !== runtimeRow[key]), runtimeRow]
                .sort((a, b) => String(a[key]).localeCompare(String(b[key])));
        }

        function validSidecarRows(table, columns, keyColumn = 'Date') {
            if (!table || columns.some((name, index) => table.header[index] !== name)) return [];
            return table.rows
                .map(item => item.object)
                .filter(row => /^\d{4}-\d{2}-\d{2}$/.test(row[keyColumn] || '') && String(row.Actionable || '').toLowerCase() === 'false');
        }

        function upsertRuntimeEventRow(rows, runtimeRow) {
            if (!runtimeRow) return rows;
            const key = row => [row.Date, row.EventTitle, row.SourceUrl].join('|');
            const runtimeKey = key(runtimeRow);
            return [...rows.filter(row => key(row) !== runtimeKey), runtimeRow]
                .sort((a, b) => String(a.Date).localeCompare(String(b.Date)));
        }

        function normalizeNewsScanEvents(snapshot) {
            if (!snapshot || !Array.isArray(snapshot.events)) return [];
            return snapshot.events
                .filter(event => event && event.candidateRow)
                .map(event => {
                    const row = normalizeRuntimeRow(event.candidateRow, MACRO_EVENT_COLUMNS, 'macro_event');
                    if (!row || String(row.Actionable || '').toLowerCase() !== 'false') return null;
                    return {
                        ...event,
                        candidateRow: {

                            EventKey: event.eventKey || '',
                            Score: event.score,
                            ReviewDeadline: event.reviewDeadline || snapshot.reviewDeadline || '',
                            PublishedAt: event.publishedAt || '',
                        },
                    };

                .filter(Boolean);
        }

        function upsertRuntimeEventRows(rows, runtimeRows) {
            return (runtimeRows || []).reduce((current, row) => upsertRuntimeEventRow(current, row), rows);

        function expectedQuarterForDate(today = new Date()) {
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            if (month > 11 || (month === 11 && day >= 15)) return `${year}Q3`;
            if (month > 8 || (month === 8 && day >= 15)) return `${year}Q2`;
            if (month > 5 || (month === 5 && day >= 15)) return `${year}Q1`;
            return `${year - 1}Q4`;

            if (fedProb >= 70) cap += 3; else if (fedProb >= 60) cap += 2; else if (fedProb >= 50) cap += 1;

            if (Number.isFinite(price) && Number.isFinite(blockPrice) && blockPrice > 0) {
                const distBlock = (price - blockPrice) / blockPrice;
                if (distBlock >= 0.25) cap += 3; else if (distBlock >= 0.15) cap += 2; else if (distBlock >= 0.05) cap += 1;
            }

        function calculateMrdObservation({ validDaily, currentPrice, prevQPrice, cashDividend, us10yVal, epsYoy }) {

                    if (distHigh < -35) { score += 35; signals.push(`距高點${distHigh.toFixed(1)}%（極度超跌+35）`); }

                    else if (distHigh < -8) { score += 8; signals.push(`距高點${distHigh.toFixed(1)}%（輕度超跌+8）`); }

        function calculateMidrObservation({ currentPB, cashDividend, currentPrice, us10yVal, fedProbVal, dynamicEpsYoY, rawRiskLevel, threshold = -0.15 }) {
            if (!Number.isFinite(currentPB) || !Number.isFinite(cashDividend) || !Number.isFinite(currentPrice) || !Number.isFinite(us10yVal) || !Number.isFinite(dynamicEpsYoY)) return null;
            const w = { ya: 0.20, val: 0.25, frv: 0.20, rtm: 0.10, mdr: 0.25 };
            const currentYield = (cashDividend / currentPrice) * 100;
            const excessYield = currentYield - us10yVal;
            const yaScore = excessYield >= 0 ? Math.min(1.0, Math.log(1 + excessYield) / Math.log(3)) : Math.max(-1.0, -Math.log(1 + Math.abs(excessYield)) / Math.log(3));
            const pbProspect = (pb) => {
                const pbRef = 1.923, pbAdd = 1.162, pbStrict = 2.115;
                let base;
                if (pb <= pbRef) base = Math.pow(Math.min((pbRef - pb) / (pbRef - pbAdd), 1.0), 0.88);
                else base = Math.max(-2.25 * Math.pow(Math.min((pb - pbRef) / (pbStrict - pbRef), 2.0), 0.88) / 2.25, -1.0);
                return Math.max(base + (pb > pbRef ? -0.10 : 0) + (pb > pbStrict ? -0.20 : 0), -1.0);
            };
            const pbScoreRaw = pbProspect(currentPB);
            let frvScore = 0.2;
            if (dynamicEpsYoY > 50) frvScore = 0.8; else if (dynamicEpsYoY > 20) frvScore = 0.5;
            const rtmScore = 0.1;

            const riskKeyword = getRiskKeyword(rawRiskLevel);
            const ud = riskKeyword === 'CAUTION' ? 0.90 : riskKeyword === 'SYSTEMIC' ? 0.80 : 1.0;
            const rawMidr = yaScore * w.ya + pbScoreRaw * w.val + frvScore * w.frv + rtmScore * w.rtm + mdrScore * w.mdr;

                    const chartMax = Math.max(...prices, bvps * 3.0) * 1.04;

                        id: 'pbBand',
                        beforeDraw(chart) {
                            const { ctx, chartArea, scales } = chart;
                            if (!chartArea || !scales || !scales.y || !scales.y.max) return;
                            const { top, bottom, left, right } = chartArea;
                            const toY = v => Math.min(Math.max(scales.y.getPixelForValue(v), top), bottom);
                            ctx.save();
                            ctx.fillStyle = 'rgba(9, 14, 26, 0.92)'; ctx.fillRect(left, top, right - left, bottom - top);
                            [
                                { from: bvps * 3.0, to: scales.y.max, color: 'rgba(148, 63, 96, 0.10)' },
                                { from: bvps * 2.5, to: bvps * 3.0, color: 'rgba(58, 88, 132, 0.22)' },
                                { from: bvps * 2.0, to: bvps * 2.5, color: 'rgba(52, 103, 139, 0.20)' },
                                { from: bvps * 1.5, to: bvps * 2.0, color: 'rgba(43, 111, 137, 0.18)' },
                                { from: bvps * 1.0, to: bvps * 1.5, color: 'rgba(34, 118, 124, 0.17)' },
                                { from: bvps * 0.5, to: bvps * 1.0, color: 'rgba(28, 91, 96, 0.14)' },
                            ].forEach(band => {
                                const y1 = toY(band.to);
                                const y2 = toY(band.from);
                                ctx.fillStyle = band.color;
                                ctx.fillRect(left, y1, right - left, y2 - y1);
                            });
                            pbMultiples.forEach(multiple => {
                                const mark = { value: bvps * multiple, color: multiple >= 2.5 ? '#9fb4d6' : multiple >= 2 ? '#8fc7d6' : '#72c3c2' };
                                const y = toY(mark.value);
                                ctx.strokeStyle = mark.color;
                                ctx.setLineDash([3, 6]);
                                ctx.lineWidth = multiple === 2.0 ? 1.2 : 0.9;
                                ctx.beginPath();
                                ctx.moveTo(left, y);
                                ctx.lineTo(right, y);
                                ctx.stroke();
                                ctx.setLineDash([]);

                            ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
                            ctx.fillRect(labelX - 4, labelY - 13, 44, 17);
                            ctx.fillStyle = '#dbeafe';
                            ctx.strokeText(text, labelX, labelY);
                            ctx.fillText(text, labelX, labelY);

                                    gradient.addColorStop(0.62, 'rgba(45,99,132,0.16)');

                                    return gradient;
                                },
                                borderWidth: 2.4,
                                pointRadius: context => context.dataIndex === prices.length - 1 ? 4 : 0,
                                pointHoverRadius: 5,
                                pointBackgroundColor: '#e0f2fe',
                                pointBorderColor: '#7dd3fc',
                                pointBorderWidth: 2,
                                fill: true,
                                tension: 0.28,
                            }]

                        options: {

                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            layout: { padding: { top: 8, right: 10, bottom: 0, left: 2 } },
                            plugins: {

                                        font: { size: 10, family: 'JetBrains Mono' },
                                        maxTicksLimit: 5,
                                        callback(value) {
                                            const label = this.getLabelForValue(value);

                                y: {

            return (

        function calculateDecisionConfidence({ coreData, governance, issues, riskKeyword, dividendYield, quality }) {
            const fieldChecks = [
                Number.isFinite(coreData?.pb),
                Number.isFinite(coreData?.price),
                Number.isFinite(coreData?.epsYoy),
                Number.isFinite(dividendYield),
                Number.isFinite(coreData?.roe),
                Number.isFinite(coreData?.us10y),
                Number.isFinite(coreData?.vix),
                Number.isFinite(quality),
            ];
            const completeCount = fieldChecks.filter(Boolean).length;
            const completenessScore = Math.round((completeCount / fieldChecks.length) * 22);
            const authorityScore =
                (governance?.authority?.valid ? 16 : 0) +
                (governance?.rules?.valid ? 8 : 0) +
                (governance?.daily?.valid ? 5 : 0) +
                (governance?.macro?.valid ? 5 : 0);
            const freshnessPoints = freshness => {
                if (!freshness) return 0;
                if (freshness.code === 'FRESH') return 8;
                if (freshness.code === 'RUNTIME_SNAPSHOT') return 4;
                if (freshness.code === 'STALE') return 2;
                return 0;
            };
            const freshnessScore =
                freshnessPoints(governance?.master?.freshness) +
                freshnessPoints(governance?.daily?.freshness) +
                freshnessPoints(governance?.macro?.freshness);
            const invalidRows =
                (governance?.master?.invalidRows || 0) +
                (governance?.daily?.invalidRows || 0) +
                (governance?.macro?.invalidRows || 0);
            const consistencyScore = Math.max(0, 12 - invalidRows * 3);
            const runtimePenalty = governance?.runtime?.active ? 12 : 0;
            const confidenceIssues = [];
            if (governance?.runtime?.active) confidenceIssues.push('runtime 臨時快照尚未正式同步');
            if (governance?.authority && !governance.authority.valid) confidenceIssues.push('正式 CSV authority/hash 未通過');
            if (governance?.rules && !governance.rules.valid) confidenceIssues.push('規則 manifest 未通過');
            if (governance?.daily && !governance.daily.valid) confidenceIssues.push('每日股價 CSV schema/欄位未通過');
            if (governance?.macro && !governance.macro.valid) confidenceIssues.push('總經 CSV schema/欄位未通過');
            if (governance?.decisionStatus === 'INSUFFICIENT_DATA') confidenceIssues.push('正式資料不足');
            const issueCount = confidenceIssues.length;
            const issuePenalty = Math.min(18, issueCount * 3);
            const systemicPenalty = riskKeyword === 'SYSTEMIC' ? 8 : 0;
            const rawScore = 18 + authorityScore + freshnessScore + completenessScore + consistencyScore - runtimePenalty - issuePenalty - systemicPenalty;
            const statusCap = governance?.runtime?.active
                ? 72
                : governance?.decisionStatus === 'READY'
                    ? 88
                    : governance?.decisionStatus === 'STALE_DATA'
                        ? 68
                        : 55;
            const confidence = Math.max(20, Math.min(statusCap, Math.round(rawScore)));
            const confidenceZh = confidence >= 80
                ? '高信心：正式資料鏈完整'
                : confidence >= 65
                    ? '中高信心：可判讀但需註記'
                    : confidence >= 50
                        ? '觀察信心：資料仍需複核'
                        : '低信心：僅保留風險提醒';
            const confidenceBasis = [
                `欄位完整度 ${completeCount}/${fieldChecks.length}`,
                `權威檢核 ${authorityScore}/34`,
                `新鮮度 ${freshnessScore}/24`,
                `一致性 ${consistencyScore}/12（異常列 ${invalidRows}）`,
                runtimePenalty ? `臨時快照扣 ${runtimePenalty}` : '無臨時快照扣分',
                issuePenalty ? `發布阻斷扣 ${issuePenalty}（${issueCount} 項 × 3 分）` : '無發布阻斷扣分',
                systemicPenalty ? `系統性風險扣 ${systemicPenalty}` : '無系統性風險扣分',
                `狀態上限 ${statusCap}`,
            ].join('；');
            return {
                confidence,
                confidenceZh,
                confidenceBasis,
                completeCount,
                fieldTotal: fieldChecks.length,
                completenessScore,
                authorityScore,
                freshnessScore,
                consistencyScore,
                invalidRows,
                runtimePenalty,
                issueCount,
                issuePenalty,
                systemicPenalty,
                statusCap,
            };
        }

        function buildWarroomBrief({ coreData, governance, midrResult, mrdResult, dimasScore, dimasLevel, batch2Data }) {
            const hasDecisionData = Number.isFinite(coreData?.pb) && Number.isFinite(coreData?.price) && Number.isFinite(coreData?.epsYoy);
            const dataReady = governance?.decisionStatus === 'READY' || coreData?.decisionStatus === 'OBSERVATION_ONLY';
            const issues = governance?.issues || [];
            const dividendYield = Number.isFinite(coreData?.cashDividend) && Number.isFinite(coreData?.price)
                ? (coreData.cashDividend / coreData.price) * 100
                : null;
            const pb = coreData?.pb;
            const epsYoy = coreData?.epsYoy;
            const roe = coreData?.roe;
            const quality = batch2Data?.quality;
            const riskKeyword = coreData?.riskKeyword || 'UNKNOWN';

            let title = '資料不足，維持HOLD';
            let stance = 'HOLD / 等待資料補齊';
            let tone = 'amber';
            let narrative = '目前資料尚未達正式決策條件，系統只保留觀察與風險提示。';

            if (hasDecisionData) {
                if (pb >= 2.115) {
                    title = '估值進入極端觀察區';
                    stance = 'HOLD / 風險優先';
                    tone = 'rose';
                    narrative = 'PB已高於極端參考線，若同時出現總經壓力或EPS動能轉弱，決策重點應放在曝險控管與反證檢查。';
                } else if (pb >= 1.923) {
                    title = '估值偏高，暫不追價';
                    stance = 'HOLD / 等待回落或新證據';

                    narrative = 'PB高於上緣參考線，基本面成長仍可支持觀察，但目前不宜把高估值解讀成加碼訊號。';
                } else if (pb <= 1.162 && epsYoy > 0) {
                    title = '低估區出現，但仍需確認資料新鮮度';
                    stance = 'HOLD / 低位觀察';
                    tone = 'emerald';
                    narrative = 'PB落入低位觀察區且EPS仍為正成長，屬於可列入人工複核的候選情境；正式規則仍維持停用。';
                } else {
                    title = '估值在參考區間內';
                    stance = 'HOLD / 中性觀察';
                    tone = 'sky';
                    narrative = '目前估值未觸發極端訊號，重點轉向EPS動能、殖利率相對美債與總經風險是否同步改善。';

            if (!dataReady || issues.length > 0) {
                title = hasDecisionData ? `${title}，但資料狀態需保留註記` : title;
                narrative = `${narrative} 目前仍有資料狀態或新鮮度註記，正式報告必須同步揭露。`;
            }

            const confidencePackage = calculateDecisionConfidence({ coreData, governance, issues, riskKeyword, dividendYield, quality });
            const { confidence, confidenceZh, confidenceBasis } = confidencePackage;

            const toneClass = {
                rose: 'border-rose-500/40 bg-rose-950/20 text-rose-300',
                amber: 'border-amber-500/40 bg-amber-950/20 text-amber-300',
                emerald: 'border-emerald-500/40 bg-emerald-950/20 text-emerald-300',
                sky: 'border-sky-500/40 bg-sky-950/20 text-sky-300',
            }[tone] || 'border-slate-500/40 bg-slate-950/20 text-slate-300';

            const evidence = [
                {
                    label: '估值水位',
                    value: Number.isFinite(pb) ? `PB ${pb.toFixed(3)}x，股價 ${formatNumber(coreData.price, 2)} 元` : 'N/A',
                    note: Number.isFinite(coreData?.blockPrice) ? `上緣參考線約 ${formatNumber(coreData.blockPrice, 0)} 元；資料狀態：${coreData?.decisionStatusZh || '僅供觀察'}` : '資料不足',
                    color: Number.isFinite(pb) && pb >= 1.923 ? 'text-rose-300' : Number.isFinite(pb) && pb <= 1.162 ? 'text-emerald-300' : 'text-sky-300',
                },
                {
                    label: '基本面動能',
                    value: Number.isFinite(epsYoy) ? `EPS YoY ${epsYoy > 0 ? '+' : ''}${formatNumber(epsYoy, 2)}%` : 'N/A',
                    note: `ROE ${Number.isFinite(roe) ? `${formatNumber(roe, 2)}%` : 'N/A'}；品質分 ${Number.isFinite(quality) ? `${quality}/100` : 'N/A'}；狀態：僅供觀察`,
                    color: Number.isFinite(epsYoy) && epsYoy > 20 ? 'text-emerald-300' : Number.isFinite(epsYoy) && epsYoy < 0 ? 'text-rose-300' : 'text-amber-300',

                {
                    label: '收益率比較',
                    value: Number.isFinite(dividendYield) ? `殖利率 ${formatNumber(dividendYield, 2)}%` : 'N/A',
                    note: Number.isFinite(coreData?.us10y) ? `美債10年 ${formatNumber(coreData.us10y, 3)}%；利差 ${Number.isFinite(dividendYield) ? formatNumber(dividendYield - coreData.us10y, 2) : 'N/A'} 個百分點` : '美債資料不足',

                {

            const counterEvidence = [

                midrResult?.verdict ? `MIDR=${midrResult.total}（${midrResult.verdict}），只做統計觀察。` : 'MIDR尚未形成完整觀察值。',
                mrdResult?.message || 'MRD尚未形成完整觀察值。',

            const decisionQuestions = [
                '若要提高曝險，是否有比PB更強的新增基本面證據？',

            const invalidConditions = [
                '仍是臨時快照或正式資料未補齊：只能觀察，不能出正式報告。',
                'PB、EPS、殖利率任一關鍵欄位缺值或被改寫：必須重算結論。',
                '總經風險升到 SYSTEMIC，或規則狀態不完整：HOLD 結論需重審。',
            ];

            return { title, stance, narrative, toneClass, confidence, confidenceZh, confidenceBasis, confidenceDetails: confidencePackage, evidence, counterEvidence, decisionQuestions, invalidConditions };
        }

        const WarroomDecisionBrief = ({ brief }) => {
            if (!brief) return null;
            return (
                <div id="warroom-decision-brief" data-testid="warroom-decision-brief" className={`glass-panel p-6 shrink-0 z-10 border ${brief.toneClass}`}>

                        <div className="col-span-2 xl:col-span-1 min-w-0">

                            <p className="text-[13px] md:text-sm text-slate-300 mt-2 leading-relaxed max-w-3xl">{brief.narrative}</p>
                        </div>
                        <div className="rounded-lg border border-cyan-500/30 bg-slate-950/70 px-3 xl:px-4 py-3">
                            <div className="flex items-end justify-between gap-2">
                                <div>
                                    <div className="text-[10px] text-slate-500 font-bold">判讀信心</div>
                                    <div className="text-3xl font-black text-cyan-300 font-num mt-1">{brief.confidence}%</div>
                                </div>
                                <div className="text-[10px] text-slate-400 mb-1">{brief.confidenceZh}</div>
                            </div>
                            <div className="h-2 bg-slate-800 rounded-full mt-3 overflow-hidden">
                                <div className="h-full bg-cyan-400 rounded-full" style={{ width: `${brief.confidence}%` }}></div>
                            </div>
                        </div>
                        <div className="rounded-lg border border-slate-600 bg-slate-950/70 px-3 xl:px-4 py-3 text-right">
                            <div className="text-[10px] text-slate-500 font-bold">系統意見</div>
                            <div className="text-xl font-black text-amber-300 mt-1">{brief.stance}</div>
                            <div className="text-[10px] text-slate-500 mt-1">actionable:false</div>
                        </div>
                    </div>

                    <div className="md:hidden rounded-lg border border-slate-700 bg-slate-950/60 p-3">
                        <div className="text-[11px] font-black text-cyan-300 mb-1">手機摘要</div>

                            主證據：{brief.evidence[0]?.value || 'N/A'}。重審條件：{brief.invalidConditions[0]} 詳細證據與資料品質見下方。

                    </div>

                    <div className="hidden md:grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_minmax(320px,0.65fr)] gap-3">

                            <div className="text-[11px] font-black text-cyan-300 mb-2">直接證據摘要</div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                                {brief.evidence.slice(0, 3).map((item, index) => (
                                    <div key={index} className="rounded border border-slate-800 bg-slate-900/70 px-3 py-2">
                                        <div className="text-[10px] text-slate-500 font-bold">{item.label}</div>
                                        <div className={`text-[13px] font-black font-num mt-0.5 ${item.color}`}>{item.value}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="rounded-lg border border-amber-500/20 bg-slate-950/60 p-3">
                            <div className="text-[11px] font-black text-amber-300 mb-2">重審條件 / 反證摘要</div>
                            <ul className="space-y-1 text-[11px] text-slate-300 leading-relaxed">
                                {brief.invalidConditions.map((item, index) => <li key={index} className="flex gap-2"><span className="text-amber-300 font-num">{index + 1}</span><span>{item}</span></li>)}
                            </ul>
                            <div className="mt-2 border-t border-slate-800 pt-2 text-[11px] text-slate-400 leading-relaxed">{brief.counterEvidence[0]}</div>
                        </div>
                    </div>
                </div>
            );
        };

        const ConceptHero = ({ brief, governance, coreData }) => {
            if (!brief) return null;
            const isReady = governance?.decisionStatus === 'READY';
            const invalidConditions = brief.invalidConditions || [];
            const freshness = governance?.daily?.freshness?.zh || governance?.statusZh || '驗證中';
            const stanceLabel = (brief.stance || 'HOLD').split('/')[0].trim() || 'HOLD';
            const compactNarrative = Number.isFinite(coreData?.pb) && coreData.pb >= 1.923

            return (

                        <div className="panel-title mb-3">系統結論</div>
                        <div className="grid grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)] items-end gap-4">
                            <div className="text-[48px] leading-none font-black text-cyan-300 tracking-normal">{stanceLabel}</div>
                            <div>
                                <div className="metric-label mb-1">判讀信心</div>

                                    <span className="text-[34px] leading-none font-black text-cyan-300 font-num">{brief.confidence}%</span>
                                </div>
                                <div className="h-2 bg-slate-700 rounded-full mt-3 overflow-hidden">
                                    <div className="h-full bg-cyan-400 rounded-full" style={{ width: `${brief.confidence}%` }}></div>
                                </div>
                            </div>

                        <p className="readable-copy text-slate-100 mt-4">{compactNarrative}</p>
                        <div className="mt-3 pt-3 border-t border-slate-700/70 flex items-center justify-between gap-3 data-note">
                            <span>僅供決策參考 | actionable:false</span>
                            <span className="w-6 h-6 rounded-full border border-slate-500 flex items-center justify-center text-slate-300 font-bold">i</span>
                        </div>
                    </div>
                    <div className="hidden md:grid grid-cols-[minmax(0,1fr)_190px_140px_minmax(280px,0.62fr)]">
                        <div className="p-4 xl:p-5 border-r border-slate-700/70 min-w-0">
                            <div className="panel-kicker">系統結論</div>
                            <h2 className="text-[22px] xl:text-[25px] font-black text-white leading-snug mt-2">{brief.title}</h2>

                        <div className="p-4 border-r border-slate-700/70 flex flex-col items-start justify-center gap-2">

                                        <span>{item}</span>
                                    </li>
                                ))}

                    </div>
                    <div className="hidden md:flex px-4 py-2.5 border-t border-slate-700/70 data-note flex-wrap items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-x-4 gap-y-1">
                            <span>來源與新鮮度：公司財報／法人報告／交易所資料／總經數據</span>
                            <span>資料更新：{governance?.daily?.latestDate || governance?.master?.latestQuarter || 'N/A'}</span>

                        </div>

                    </div>

        const ConceptEvidenceSection = ({ title, items, tone = 'cyan', index }) => {
            const toneMap = {
                cyan: { title: 'text-cyan-300', badge: 'bg-cyan-500/20 border-cyan-400/40 text-cyan-200' },
                amber: { title: 'text-amber-300', badge: 'bg-amber-500/20 border-amber-400/40 text-amber-200' },
                rose: { title: 'text-rose-300', badge: 'bg-rose-500/20 border-rose-400/40 text-rose-200' },
                sky: { title: 'text-sky-300', badge: 'bg-sky-500/20 border-sky-400/40 text-sky-200' },
                emerald: { title: 'text-emerald-300', badge: 'bg-emerald-500/20 border-emerald-400/40 text-emerald-200' },

            const style = toneMap[tone] || toneMap.cyan;

            const rows = (items || []).filter(Boolean).slice(0, rowLimit);
            return (

        const ConceptSwitchChart = ({ view, dailyData, masterRows, bvps, ttmEps, coreData, batch2Data, height = 320 }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);
            const meta = {
                pe: '本益比以日收盤價除以目前 TTM EPS 估算，僅供相對趨勢觀察。',
                roe: 'ROE 與 ROIC 顯示獲利效率是否支撐估值，季度資料以最新核准 CSV 為準。',
                price: '股價走勢搭配 20 日均線，用來辨識短期動能與估值位置是否背離。',
                overview: '總覽把不同量綱標準化為 0-100，用於比較壓力來源，不代表交易訊號。',
            };
            useEffect(() => {
                if (!canvasRef.current) return;
                try {
                    if (chartRef.current) chartRef.current.destroy();
                    const ctx = canvasRef.current.getContext('2d');
                    const recentDaily = (dailyData || []).slice(-250);
                    const recentMaster = (masterRows || []).slice(-12);
                    let config = null;
                    const latestValueLabelPlugin = {
                        id: `latestValueLabel-${view}`,
                        afterDatasetsDraw(chart) {
                            if (view === 'overview') return;
                            const meta = chart.getDatasetMeta(0);
                            const points = meta?.data || [];
                            if (!points.length) return;
                            const index = points.length - 1;
                            const value = Number(chart.data.datasets?.[0]?.data?.[index]);
                            if (!Number.isFinite(value)) return;
                            const point = points[index];
                            const { ctx, chartArea } = chart;
                            const label = view === 'pe'
                                ? `PE ${value.toFixed(1)}x`
                                : view === 'roe'
                                    ? `${chart.data.datasets[0].label} ${value.toFixed(1)}%`
                                    : `${value.toFixed(1)}元`;
                            ctx.save();
                            ctx.font = '800 10px JetBrains Mono, monospace';
                            ctx.textAlign = 'left';
                            ctx.fillStyle = '#e0f2fe';
                            ctx.strokeStyle = 'rgba(8,13,25,0.92)';
                            ctx.lineWidth = 4;
                            const x = Math.min(point.x + 8, chartArea.right - 70);
                            const y = Math.max(chartArea.top + 14, point.y - 8);
                            ctx.strokeText(label, x, y);
                            ctx.fillText(label, x, y);
                            ctx.restore();
                        }
                    };

                    if (view === 'pe') {
                        const source = recentDaily
                            .map(row => ({ label: row.Date, value: Number(row.Close) / ttmEps }))
                            .filter(row => Number.isFinite(row.value) && row.value > 0);
                        if (source.length) {
                            const values = source.map(row => row.value);
                            const minValue = Math.min(...values);
                            const maxValue = Math.max(...values);
                            const pad = Math.max((maxValue - minValue) * 0.22, 0.8);
                            config = {
                                type: 'line',
                                data: {
                                    labels: source.map(row => row.label),
                                    datasets: [{
                                        label: '估算本益比',
                                        data: source.map(row => row.value),
                                        borderColor: '#c4b5fd',
                                        backgroundColor(context) {

                try {
                    const payload = await fetchAppJson('/api/p1008/status?t=' + Date.now());
                    setAppState(payload);
                    setAppApiStatus('READY');
                    setAppActionError('');
                    if (payload?.jobId) {
                        try {
                            const logResponse = await fetch(`/api/p1008/log?jobId=${encodeURIComponent(payload.jobId)}&t=${Date.now()}`, { cache: 'no-store' });
                            setAppLog(logResponse.ok ? await logResponse.text() : '');
                        } catch (error) {
                            setAppLog('');
                        }
                    }
                    const refreshJobId = localStorage.getItem('p1008_app_refresh_after_job');
                    if (refreshJobId && payload?.jobId === refreshJobId && ['SUCCEEDED', 'FAILED', 'INTERRUPTED'].includes(payload?.status)) {
                        localStorage.removeItem('p1008_app_refresh_after_job');
                        if (payload.status === 'SUCCEEDED') {
                            setTimeout(() => window.location.reload(), 1200);
                        }
                    }
                    return payload;
                } catch (error) {
                    setAppApiStatus('UNAVAILABLE');
                    setAppActionError(error.message || 'P1008 App API unavailable');
                    return null;
                }
            };

            const runAppJob = async (route) => {
                setAppActionError('');
                try {
                    const payload = await fetchAppJson(route, { method: 'POST', body: '{}' });
                    setAppState(payload);
                    setAppApiStatus('READY');
                    if (payload?.jobId) localStorage.setItem('p1008_app_refresh_after_job', payload.jobId);
                } catch (error) {
                    setAppActionError(error.message || 'P1008 App job failed to start');
                    if (error.payload) setAppState(error.payload);
                }
            };

            useEffect(() => { localStorage.setItem('warroom_bias_answers', JSON.stringify(biasQuizAnswers)); }, [biasQuizAnswers]);
            useEffect(() => { if (biasType) localStorage.setItem('warroom_bias_type', JSON.stringify(biasType)); }, [biasType]);
            useEffect(() => { localStorage.setItem('warroom_eip_checks', JSON.stringify(eipChecks)); }, [eipChecks]);
            useEffect(() => { localStorage.setItem('warroom_p3_reasons', JSON.stringify(p3Reasons)); }, [p3Reasons]);

            useEffect(() => {
                let cancelled = false;
                const tick = async () => {
                    if (!cancelled) await refreshAppStatus();
                };
                tick();
                const intervalMs = appState?.status === 'RUNNING' ? 1800 : 10000;
                const timer = setInterval(tick, intervalMs);
                return () => { cancelled = true; clearInterval(timer); };
            }, [appState?.status, appState?.jobId]);

            useEffect(() => {
                let timer;
                if ((sellFuseActive || buyFuseActive) && debiasStep < 3) { timer = setTimeout(() => setDebiasStep(prev => prev + 1), 3000); }
                return () => clearTimeout(timer);
            }, [sellFuseActive, buyFuseActive, debiasStep]);

            const calcBiasType = (answers) => {
                const { q1, q2, q3 } = answers;
                if (!q1 || !q2 || !q3) return null;
                const p1Count = [q1, q2, q3].filter(a => a === 'A').length;
                const p2Count = [q1, q2, q3].filter(a => a === 'B').length;
                const p3Count = [q1, q2, q3].filter(a => a === 'C').length;
                if (p3Count >= 2) return 'P3';
                if (p1Count >= 2) return 'P1';
                if (p2Count >= 2) return 'P2';
                return 'MIXED';

                                    text: `目前股價 ${Number.isFinite(currentPrice) ? `${formatNumber(currentPrice, 2)} 元` : 'N/A'}、PB ${Number.isFinite(currentPB) ? `${formatNumber(currentPB, 3)}x` : 'N/A'}；結論是估值偏高但基本面仍支撐，維持 HOLD / 不追價。`,
                                },
                                {
                                    no: '02',
                                    title: '支持證據',
                                    text: `EPS YoY ${Number.isFinite(coreData?.epsYoy) ? `${formatNumber(coreData.epsYoy, 2)}%` : 'N/A'}、ROE ${Number.isFinite(coreData?.roe) ? `${formatNumber(coreData.roe, 2)}%` : 'N/A'}、品質分 ${Number.isFinite(displayedQualityScore) ? `${displayedQualityScore}/100` : 'N/A'}，表示獲利與財務品質仍可支撐中期觀察。`,
                                },
                                {
                                    no: '03',
                                    title: '限制風險',
                                    text: `美債10年 ${Number.isFinite(coreData?.us10y) ? `${formatNumber(coreData.us10y, 3)}%` : 'N/A'}、Fed 機率 ${Number.isFinite(coreData?.fedProb) ? `${formatNumber(coreData.fedProb, 1)}%` : 'N/A'}；總經壓力只提高重審頻率，不直接變成交易規則。`,
                                },
                                {
                                    no: '04',
                                    title: '重審條件',
                                    text: '若新財報使 EPS / ROE 下修、PB 持續高於警戒線，或正式 CSV / manifest 出現缺口，Owner 需重新審核結論與資料狀態。',
                                },
                            ].map(item => (
                                <div key={item.no} className="decision-row">
                                    <div className="decision-row-index">{item.no}</div>
                                    <div className="decision-row-body">
                                        <strong className="text-sky-400 tracking-wide">{item.title}：</strong>{item.text}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 6. 中段完美對稱雙拼：雷達圖(左) 與 河流圖(右) */}
                    <div className="p2-analysis-grid mb-6 items-stretch shrink-0 z-10">
                        
                        {/* 左：雷達圖卡片 (絕對鎖死變形) */}
                        <div className="glass-panel radar-card p-6 flex flex-col h-full border border-sky-500/20">
                            <div className="flex justify-between items-center border-b border-sky-900/50 pb-3 mb-4 shrink-0">
                                <div>
                                    <div className="panel-kicker text-sky-300">Weighted Diagnosis</div>
                                    <h3 className="panel-title text-sky-100">五維度推導權重與歸因</h3>
                                </div>
                                <span className="status-chip bg-sky-900/50 text-sky-200 border-sky-500/50">
                                    加權總分: {Number.isFinite(batch4Data?.total) ? `${batch4Data.total}/100` : 'N/A'}
                                </span>
                            </div>
                            {(() => {
                                const dimensions = (batch4Data?.dimensions || []).filter(item => Number.isFinite(item.score));
                                if (!dimensions.length || !Number.isFinite(batch4Data?.total)) {
                                    return <div className="mb-4 rounded-lg border border-amber-500/30 bg-amber-950/20 px-4 py-3 readable-copy text-amber-100">結論：資料不足，五維度推導暫不輸出結論。</div>;
                                }
                                const ranked = [...dimensions].sort((a, b) => a.score - b.score);
                                const weakest = ranked[0];
                                const strongest = ranked[ranked.length - 1];
                                const totalLabel = batch4Data.total >= 75 ? '支撐力較強' : batch4Data.total >= 60 ? '可觀察，但不足以追價' : '支撐不足，需補資料或重審';
                                return (
                                    <div className="mb-4 analysis-card border-sky-500/30 bg-sky-950/20 px-4 py-3">
                                        <div className="panel-title text-[16px]">結論：{totalLabel}</div>
                                        <div className="readable-copy mt-1">
                                            五維加權分為 <strong className="text-cyan-200 font-num">{batch4Data.total}/100</strong>；
                                            主要支撐是 <strong className="text-emerald-300">{strongest.label} {strongest.score}分</strong>，
                                            主要拖累是 <strong className="text-rose-300">{weakest.label} {weakest.score}分</strong>。
                                            本區只解釋結論來源，仍維持 actionable:false。
                                        </div>
                                    </div>
                                );
                            })()}
                            
                            <div className="radar-detail-grid flex-grow">
                                <div className="relative w-full max-w-[460px] min-h-[380px] mx-auto shrink-0 flex items-center justify-center">
                                    {batch4Data?.radarValues ? <RadarChart dataValues={batch4Data.radarValues} dimensions={batch4Data.dimensions} /> : <div className="text-sm text-slate-500 text-center leading-relaxed">資料不足，雷達圖不補假分數<br />缺值：{batch4Data?.missing?.join('、') || 'N/A'}</div>}
                                </div>
                                
                                <div className="w-full flex flex-col justify-center">
                                    <table className="w-full text-left text-[13px]">
                                        <thead>
                                            <tr className="border-b border-slate-700/80 text-slate-400">
                                                <th className="pb-2 font-bold">維度(權重)</th>
                                                <th className="pb-2 font-bold text-center">推導分</th>
                                                <th className="pb-2 font-bold text-right">加權貢獻</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-slate-300">
                                            {(batch4Data?.dimensions || []).map((item, index) => (
                                                <tr key={item.key} className="border-b border-slate-800/60 last:border-b-0">
                                                    <td className="py-3 font-bold">
                                                        <div className={['text-emerald-400','text-sky-400','text-purple-400','text-amber-400','text-rose-400'][index] || 'text-slate-300'}>{item.label}({Math.round(item.weight * 100)}%)</div>
                                                        <div className="mt-0.5 data-note leading-snug">{item.source}</div>
                                                    </td>
                                                    <td className="py-3 text-center font-num text-white text-[14px]">{Number.isFinite(item.score) ? item.score : '缺值'}</td>
                                                    <td className="py-3 text-right font-num text-sky-100 text-[13px]">{Number.isFinite(item.score) ? `${item.score} × ${item.weight.toFixed(2)} = ${(item.score * item.weight).toFixed(2)}` : '不補分'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                        <tfoot>
                                            <tr>
                                                <td colSpan="3" className="pt-3 text-right text-[12px] text-slate-400">
                                                    <div className="flex flex-wrap justify-end gap-1 items-center">
                                                        <span>{batch4Data?.methodologyZh || '五維度資料不足，未產生推導分數。'}</span>
                                                        <span className="mx-1">=</span>
                                                        <strong className="text-[14px] text-white bg-sky-900/50 px-2 py-0.5 rounded border border-sky-500/30">{Number.isFinite(batch4Data?.total) ? `${batch4Data.total}.00 分` : 'N/A'}</strong>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* 右：PB 估值結論卡片，避免重複主圖 */}
                        <div className="glass-panel p-6 flex flex-col h-full border border-slate-700/60">
                            <div className="flex justify-between items-center border-b border-sky-900/50 pb-3 mb-4 shrink-0">
                                <div>
                                    <div className="panel-kicker text-sky-300">Valuation Position</div>
                                    <h3 className="panel-title text-sky-100">
                                        {Number.isFinite(currentPB) && currentPB >= 2.1
                                            ? 'PB 估值結論：極高區，僅保留風險揭露'
                                            : Number.isFinite(currentPB) && currentPB >= 1.9
                                                ? 'PB 估值結論：警戒區，暫不追價'
                                                : 'PB 估值結論：觀察區，等待資料確認'}
                                    </h3>
                                </div>
                            </div>
                            
                            <div className="analysis-card p-4 flex flex-col xl:flex-row gap-4 items-center mb-4 shrink-0">
                                <div className="flex-1">
                                    <div className="metric-label mb-1">主題結論</div>
                                    <div className="readable-copy">
                                        當前 PB：<strong className="text-rose-400">{Number.isFinite(currentPB) ? `${currentPB}x` : 'N/A'}</strong>。
                                        結論是「估值偏高但資料狀態仍需保留註記」；本區只回答價格是否偏離基本面參考區，不產生買賣建議。
                                        正式規則仍維持 <strong className="text-amber-400">KEEP_DISABLED</strong>。
                                    </div>
                                </div>
                                <div className="flex flex-wrap gap-2 font-mono justify-center">
                                    <span className="status-chip bg-rose-900/30 text-rose-300 border-rose-500/30">判讀：偏高</span>
                                    <span className="status-chip bg-amber-900/30 text-amber-300 border-amber-500/30">行動資格：無</span>
                                    <span className="status-chip bg-sky-900/30 text-sky-300 border-sky-500/30">下一步：更新資料後複核</span>
                                </div>
                            </div>

                            <div className="w-full flex-grow analysis-card p-5 flex flex-col justify-center min-h-[200px] xl:min-h-[250px]">
                                {(() => {
                                    const pb = Number.isFinite(coreData?.pb) ? coreData.pb : null;
                                    const progress = Number.isFinite(pb) ? Math.max(0, Math.min(100, ((pb - 1.0) / 1.5) * 100)) : 0;
                                    const price = Number.isFinite(coreData?.price) ? coreData.price : null;
                                    return (
                                        <div className="space-y-5">
                                            <div className="flex items-end justify-between gap-3">
                                                <div>
                                                    <div className="metric-label">目前位置</div>
                                                    <div className="text-3xl metric-value mt-1">{Number.isFinite(pb) ? `${pb.toFixed(3)}x` : 'N/A'}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="metric-label">收盤價</div>
                                                    <div className="text-xl font-black text-cyan-300 font-num mt-1">{Number.isFinite(price) ? `${price.toFixed(1)} 元` : 'N/A'}</div>
                                                </div>
                                            </div>
                                            <div className="relative pt-5">
                                                <div className="h-4 rounded-full overflow-hidden grid grid-cols-[1fr_0.55fr_0.45fr_0.35fr] border border-slate-700">
                                                    <div className="bg-emerald-500/35"></div>
                                                    <div className="bg-cyan-500/30"></div>
                                                    <div className="bg-amber-500/35"></div>
                                                    <div className="bg-rose-500/40"></div>
                                                </div>
                                                <div className="absolute top-0 -translate-x-1/2" style={{ left: `${progress}%` }}>
                                                    <div className="w-3 h-8 rounded-full bg-white shadow-[0_0_16px_rgba(56,189,248,0.9)] border-2 border-cyan-300"></div>
                                                </div>
                                                <div className="flex justify-between text-[10px] text-slate-500 font-num mt-2">
                                                    <span>1.0x</span><span>1.5x 合理</span><span>1.9x 警戒</span><span>2.1x 極高</span><span>2.5x</span>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2 text-center text-[11px] font-bold">
                                                <div className="rounded border border-emerald-500/30 bg-emerald-950/20 text-emerald-300 px-2 py-2">低位：可列入觀察清單</div>
                                                <div className="rounded border border-amber-500/30 bg-amber-950/20 text-amber-300 px-2 py-2">警戒：暫不追價</div>
                                                <div className="rounded border border-rose-500/30 bg-rose-950/20 text-rose-300 px-2 py-2">極高：只揭露風險</div>
                                            </div>
                                             <div className="data-note">
                                                中文備註：本區主題結論為「估值偏高、暫不追價」。正式買賣規則維持 KEEP_DISABLED，輸出仍為 actionable:false。
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>
                    </div>

                    {/* 7. 歷史訊號記錄表 */}
                    <div className="glass-panel p-6 shrink-0 z-10 flex flex-col gap-4 border border-slate-700/60 mb-6">
                        <div className="flex justify-between items-center border-b border-slate-700/80 pb-3 cursor-pointer group" onClick={() => setShowHistoryTable(!showHistoryTable)}>
                            <div>
                                <div className="panel-kicker text-purple-300">Backtest Review</div>
                                <h3 className="panel-title text-purple-100 group-hover:text-purple-200 transition-colors">歷史戰績回測表（動態 AI PEG 觀察）</h3>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="status-chip bg-purple-900/40 text-purple-100 border-purple-500/30">點擊展開 / 收合</span>
                            </div>
                        </div>

                        {showHistoryTable && (
                            <div className="animate-fadeIn">
                                <div className="analysis-card p-4 mb-4 readable-copy">
                                    <strong className="text-rose-400">前視偏誤警示：</strong>
                                    EstimatedEffectiveDate 為估算值，尚未經 MOPS 驗證。歷史資料只能在有效日期之後使用，結果僅供觀察，不得作為正式交易依據。
                                    <span className="block text-[10px] text-slate-500 mt-2">actionable:false｜動態 AI 估值模型未列入正式規則</span>
                                </div>
                                <div className="analysis-card bg-sky-950/25 border-sky-500/30 p-4 mb-4 data-note text-sky-100">
                                    <strong className="text-sky-300">回測政策：</strong>
                                    {BACKTEST_POLICY.version}（{BACKTEST_POLICY.statusZh}）。每季正式 CSV 發布、重大事件改變 AI 伺服器需求或毛利率假設、總經風險升至 SYSTEMIC、或 Owner 核准新門檻時，必須重新審查回測邏輯。
                                    <span className="block text-[10px] text-slate-400 mt-2">中文備註：本區只檢查歷史資料在當時政策下的觀察訊號，不代表未來績效，也不會解除 KEEP_DISABLED / actionable:false。</span>
                                </div>
                                <div className="max-h-[350px] overflow-y-auto custom-scrollbar border border-slate-700/80 rounded-xl shadow-inner bg-slate-900/80">
                                    <table className="w-full text-left font-mono border-collapse">
                                        <thead className="bg-slate-800/90 sticky top-0 z-20 backdrop-blur-md">
                                            <tr className="text-[12px] text-slate-300 border-b border-slate-600">
                                                <th className="p-3 font-bold">季度</th>
                                                <th className="p-3 font-bold">季底收盤</th>
                                                <th className="p-3 font-bold">AI佔比</th>
                                                <th className="p-3 font-bold">PB估值</th>
                                                <th className="p-3 font-bold text-center">回測訊號</th>
                                                <th className="p-3 font-bold">政策註記</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-[13px] text-slate-300">
                                            {batch3Data?.masterRows && batch3Data.masterRows.map((row, idx) => {
                                                const isLatest = idx === batch3Data.masterRows.length - 1;
                                                const historicalPrice = finiteNumber(row, 'QuarterEndClose');
                                                const historicalPB = finiteNumber(row, 'PB_QuarterEnd');
                                                const displayPrice = isLatest ? coreData?.price : historicalPrice;
                                                const displayPB = isLatest && Number.isFinite(coreData?.pb) ? coreData.pb : historicalPB;
                                                const aiPct = finiteNumber(row, 'AI_Revenue_Pct');
                                                
                                                const backtestObservation = buildBacktestObservation(row, displayPB, isLatest);
                                                const dynamicBlock = backtestObservation.blockPb;
                                                const dynamicAdd = backtestObservation.addPb;
                                                
                                                let sigLabel = "中性觀察"; let sigStyle = "text-amber-400 bg-amber-900/20 border-amber-500/30";
                                                if (Number.isFinite(displayPB) && Number.isFinite(dynamicBlock) && displayPB >= dynamicBlock) { sigLabel = "高估觀察"; sigStyle = "text-rose-400 bg-rose-900/20 border-rose-500/30"; }
                                                else if (Number.isFinite(displayPB) && Number.isFinite(dynamicAdd) && displayPB <= dynamicAdd) { sigLabel = "低估觀察"; sigStyle = "text-emerald-400 bg-emerald-900/20 border-emerald-500/30"; }

                                                return (
                                                    <tr key={idx} className={`border-b border-slate-700/50 transition-colors ${isLatest ? 'bg-sky-900/20 font-bold text-white shadow-[inset_4px_0_0_0_#38bdf8]' : 'hover:bg-slate-800/50'}`}>
                                                        <td className="p-3">{row.Quarter || 'N/A'} {isLatest && <span className="text-[10px] bg-sky-500 text-slate-900 px-1 rounded ml-2">NOW</span>}</td>
                                                        <td className="p-3 font-num">{Number.isFinite(displayPrice) ? `${displayPrice} 元` : 'N/A'}</td>
                                                        <td className="p-3 text-purple-400 font-num">{Number.isFinite(aiPct) ? `${aiPct}%` : 'N/A'}</td>
                                                        <td className="p-3 font-num">{Number.isFinite(displayPB) ? `${displayPB.toFixed(3)}x` : 'N/A'}</td>
                                                        <td className="p-3 text-center">
                                                            <span className={`px-3 py-1 rounded border text-[11px] font-black tracking-wider ${sigStyle}`}>{sigLabel}</span>
                                                        </td>
                                                        <td className="p-3 text-[11px] text-slate-400 leading-relaxed">
                                                            <div>{backtestObservation.note}</div>
                                                            <div className="text-[10px] text-slate-500 mt-1">{backtestObservation.policyVersion}</div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 8. 底部導航 Tabs */}
                    <div className="glass-panel rounded-xl overflow-hidden shrink-0 z-10 border-sky-500/20">
                        <div className="flex border-b border-slate-800 bg-slate-900/60 text-xs">
                            {['reports', 'sop'].map(tab => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-4 font-bold transition-all uppercase tracking-wider ${activeTab === tab ? 'bg-sky-900/40 text-sky-400 border-b-2 border-sky-400 shadow-[inset_0_-4px_10px_rgba(14,165,233,0.1)]' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}>{tab === 'reports' ? '機構研報庫' : '系統操作 SOP'}</button>
                            ))}
                        </div>
                        <div className="p-5 text-sm text-slate-300 bg-slate-900/30 flex items-center justify-between">
                            <p>{activeTab === 'reports' ? '外部研究索引就緒，系統已過濾並整理最新的 2317 戰情室專屬報告。' : 'SOP v4.0 已上線。正式 CSV、臨時快照與 Owner 發布流程已分層。'}</p>
                            <a href={activeTab === 'reports' ? 'reports.html?from=oldui' : 'SOP_v4.html?from=oldui'} target="_blank" className="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg shadow-lg shadow-sky-900/40 transition-colors flex items-center gap-2 font-bold text-xs">開啟模組</a>
                        </div>
                    </div>

                    <nav className="md:hidden fixed left-0 right-0 bottom-0 z-40 bg-slate-950/95 border-t border-slate-700 shadow-[0_-10px_30px_rgba(0,0,0,0.45)]">
                        <div className="grid grid-cols-5 items-end text-center text-[11px] text-slate-400">
                            <button type="button" className="py-2 text-cyan-300 font-bold">
                                <div className="text-[22px] leading-none">▦</div>
                                <div className="mt-1">戰情室</div>
                            </button>
                            <button type="button" className="py-2">
                                <div className="text-[22px] leading-none">☆</div>
                                <div className="mt-1">監控清單</div>
                            </button>
                            <button type="button" className="-mt-6 mx-auto w-16 h-16 rounded-full bg-blue-600 text-white border border-blue-300 shadow-lg flex flex-col items-center justify-center font-bold">
                                <div className="text-[24px] leading-none">≡</div>
                                <div className="text-[11px] mt-1">篩選</div>
                            </button>
                            <button type="button" className="py-2">
                                <div className="text-[22px] leading-none">⚙</div>
                                <div className="mt-1">設定</div>
                            </button>
                            <button type="button" className="py-2">
                                <div className="text-[22px] leading-none">•••</div>
                                <div className="mt-1">更多</div>
                            </button>
                        </div>
                    </nav>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
